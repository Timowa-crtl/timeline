<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timeline Planner · prototype v2</title>
<style>
/* ================================================================ tokens */
:root {
  --bg:#f5f5f2; --panel:#fff; --ink:#1d1d1b; --muted:#66655f; --line:#e2e1db; --line2:#efeee9;
  --accent:#2f6fed; --accent-ink:#fff; --red:#cf3f3b; --amber:#c98f00; --green:#2a8f52; --grey:#9a998f;
  --weekend:#f3f2ee; --gband:#f7f6f3; --done:#9a998f; --dep-open:#6b6a64; --dep-fin:#c4c3bc; --shadow:0 20px 50px rgba(0,0,0,.22);
  --lw:240px; --side:330px; --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme=light]){
  --bg:#141412; --panel:#1c1c1a; --ink:#ecebe6; --muted:#a09f99; --line:#33332f; --line2:#272725; --grey:#77766f;
  --weekend:#20201e; --gband:#222220; --done:#76756e; --dep-open:#a7a69f; --dep-fin:#4d4c48; --accent:#5b8df5; --accent-ink:#0b1220; --red:#ec5f5a; --amber:#e3ad2b; --green:#43b874;
  --shadow:0 20px 50px rgba(0,0,0,.6); color-scheme:dark; } }
:root[data-theme=dark]{
  --bg:#141412; --panel:#1c1c1a; --ink:#ecebe6; --muted:#a09f99; --line:#33332f; --line2:#272725; --grey:#77766f;
  --weekend:#20201e; --gband:#222220; --done:#76756e; --dep-open:#a7a69f; --dep-fin:#4d4c48; --accent:#5b8df5; --accent-ink:#0b1220; --red:#ec5f5a; --amber:#e3ad2b; --green:#43b874;
  --shadow:0 20px 50px rgba(0,0,0,.6); color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .sp{flex:1}
a{color:var(--accent)}

/* ================================================================ controls */
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer;line-height:1.2;min-height:36px;display:inline-flex;align-items:center;gap:6px;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:550}
.btn.danger{color:var(--red)} .btn.danger.solid{background:var(--red);border-color:var(--red);color:#fff}
.btn.small{padding:4px 9px;font-size:12.5px;min-height:30px}
.btn.icon{padding:0;width:36px;justify-content:center}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:7px 11px;cursor:pointer;border-right:1px solid var(--line);min-height:34px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--panel)}
.seg.wide{display:flex}.seg.wide button{flex:1}
.sel,.txt{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 9px;min-height:36px;max-width:100%}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px 4px 9px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:30px;color:var(--ink)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.chip.on{background:color-mix(in srgb,var(--c) 16%,var(--panel));border-color:var(--c)}
.chip.static{cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ck{display:inline-flex;gap:7px;align-items:center;cursor:pointer;font-size:13px;min-height:30px}
.ck input{width:16px;height:16px;margin:0;accent-color:var(--accent)}

/* ================================================================ top */
.top{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:700;display:inline-flex;align-items:center;gap:8px;font-size:15px}
.brand i{font-style:normal;font-weight:400;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.logo{width:24px;height:24px;border-radius:6px;background:var(--accent);position:relative;flex:none}
.logo::before,.logo::after{content:"";position:absolute;height:4px;border-radius:2px;background:#fff}
.logo::before{left:4px;top:7px;width:10px}.logo::after{left:8px;top:13px;width:12px;opacity:.7}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mobile-only{display:none!important}
.banner{padding:8px 12px;font-size:13px;background:color-mix(in srgb,var(--amber) 14%,var(--panel));border-bottom:1px solid var(--line)}

/* ================================================================ layout */
.tabs{display:none}
.app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--side)}
.app.side-collapsed{grid-template-columns:minmax(0,1fr)}
.app.side-collapsed .side{display:none}
.tlp{min-width:0;min-height:0;display:grid;grid-template-columns:var(--lw) minmax(0,1fr);grid-template-rows:46px minmax(0,1fr);background:var(--panel);border-right:1px solid var(--line);position:relative}
#corner{border-bottom:1px solid var(--line);border-right:1px solid var(--line);display:flex;align-items:flex-end;padding:0 10px 7px;font-size:12px;color:var(--muted)}
#axisWrap{overflow:hidden;border-bottom:1px solid var(--line)}
#labelsWrap{overflow-x:hidden;overflow-y:auto;border-right:1px solid var(--line);scrollbar-width:none;overscroll-behavior:contain}
#labelsWrap::-webkit-scrollbar{display:none}
#chartWrap{overflow:auto;touch-action:pan-x pan-y;overscroll-behavior:contain}
#labels{padding-bottom:40px}
.tl-empty{position:absolute;inset:46px 0 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);pointer-events:none}
.tl-empty>*{pointer-events:auto}

/* label rows */
.lg{display:flex;align-items:center;gap:8px;padding:0 10px;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--gband);white-space:nowrap;overflow:hidden}
.lg i{width:9px;height:9px;border-radius:3px;flex:none}
.li{display:flex;align-items:center;gap:6px;padding:0 8px 0 4px;border-bottom:1px solid var(--line2);cursor:pointer;white-space:nowrap}
.li:hover{background:var(--gband)}
.li .t{overflow:hidden;text-overflow:ellipsis;flex:1}
.li.sub{padding-left:26px;font-size:13px;color:var(--muted)}
.li.sub .t{color:var(--ink)}
.subrows-connector .li.sub{position:relative}
.subrows-connector .li.sub::before{content:"";position:absolute;left:13px;top:0;bottom:50%;width:8px;border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);border-bottom-left-radius:4px}
.exp{width:20px;height:24px;border:0;background:none;cursor:pointer;color:var(--muted);padding:0;flex:none;font-size:11px}
.exp.none{visibility:hidden}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}
.st-overdue .dot{background:var(--red)}.st-soon .dot{background:var(--amber)}.st-done .dot{background:var(--done)}
.st-unconfirmed .dot{background:transparent;border:1.5px dashed var(--grey)}
.st-closed .dot{background:var(--line)}
.st-done .t,.st-closed .t{color:var(--muted)!important;text-decoration:line-through}
.cnt{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ================================================================ svg */
svg text{font-family:inherit}
.ax-u{stroke:var(--line)}.ax-ut{font-size:12px;font-weight:650;fill:var(--ink)}
.ax-l{stroke:var(--line)}.ax-lt{font-size:11px;fill:var(--muted)}.ax-lt.we{opacity:.55}
.today-pill{fill:var(--red)}.today-t{font-size:9.5px;font-weight:700;fill:#fff;letter-spacing:.04em}
.weekend{fill:var(--weekend)}.gband{fill:var(--gband)}.rowline{stroke:var(--line2)}
.grid{stroke:var(--line2)}.grid-u{stroke:var(--line)}
.todayline{stroke:var(--red);stroke-width:1.5}
.hit{fill:transparent}
.it{cursor:pointer;outline:none}
.it:focus-visible .hit{fill:color-mix(in srgb,var(--accent) 12%,transparent);stroke:var(--accent);stroke-width:1.5}
.bar{fill-opacity:.2;stroke-width:1.2}
.bar-past{fill:none;stroke:var(--grey);stroke-width:1.2;stroke-dasharray:3 2.5}
.bar.ghost{fill-opacity:.06;stroke-dasharray:3 3;stroke-opacity:.6}
.prog{fill-opacity:.5}
.it:hover .bar{fill-opacity:.3}
.it.done .bar{fill-opacity:.1;stroke-opacity:.45}
.it.closed{opacity:.4}
/* icons: flag = deadline · tile = booked · check = done (quiet grey) */
.flag line{stroke:var(--fs);stroke-width:1.8;stroke-linecap:round}
.flag path{fill:var(--ff);stroke:var(--fs);stroke-width:1.2;stroke-linejoin:round}
.flag.open{--ff:var(--panel);--fs:var(--muted)}
.flag.soon{--ff:var(--amber);--fs:var(--amber)}
.flag.overdue{--ff:var(--red);--fs:var(--red)}
.flag.faded{--ff:var(--panel);--fs:var(--grey);opacity:.6}
.flag.ghost{--ff:none;--fs:var(--grey);opacity:.6}
.flag.ghost line,.flag.ghost path{stroke-dasharray:2 2}
.tile .tb{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}
.tile .band{fill:var(--ink)}
.tile text{fill:var(--ink);font-weight:750}
.tile.unc .tb{stroke:var(--grey);stroke-dasharray:2.5 2}
.tile.unc text{fill:var(--grey);font-weight:800}
.sched-q{opacity:0;cursor:pointer;transition:opacity .12s}
.it:hover .sched-q,.it:focus-visible .sched-q{opacity:1}
@media (hover:none){.sched-q{display:none}}
input[type=date]{cursor:pointer;caret-color:transparent}
.sched-pick{position:fixed;width:1px;height:1px;opacity:0;border:0;padding:0;z-index:50}
.ck-i circle{fill:var(--done)}
.ck-i path{fill:none;stroke:var(--panel);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sm-open{fill:var(--panel);stroke:var(--muted);stroke-width:1.4}
.tl-lbl{font-size:11.5px;fill:var(--muted)}
/* dependency arrows: open = dark solid · finished = light solid · done before prerequisite = light dotted */
.dep{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.dep.open,.dep-ch.open{stroke:var(--dep-open)}
.dep.fin,.dep-ch.fin,.dep-ch.early{stroke:var(--dep-fin)}
.dep.early{stroke:var(--dep-fin);stroke-dasharray:1.5 3.5;stroke-width:1.6}
.dep-ch{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sub-box{fill:var(--panel);stroke:var(--muted);stroke-width:1.3}
.sub-mk{cursor:pointer}
.legend-box{margin-bottom:10px}
.legend-box summary{cursor:pointer;font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:650;color:var(--muted);margin-bottom:8px}
.legend{display:grid;grid-template-columns:38px 1fr;gap:5px 8px;align-items:center;font-size:12px;color:var(--muted)}
.legend svg{overflow:visible}

/* ================================================================ side */
.side{overflow:auto;padding:12px 14px calc(30px + var(--safe-b))}
.sh{margin:18px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;gap:6px;align-items:center;font-weight:650}
.sh:first-child{margin-top:2px}
.sh span{background:var(--line);border-radius:999px;padding:0 7px;color:var(--ink)}
.sh-overdue{color:var(--red)}
.up{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer}
.up:hover{border-color:var(--muted)}
.up.st-overdue{border-left:3px solid var(--red)}
.up.st-soon{border-left:3px solid var(--amber)}
.up.st-unconfirmed{border-left:3px dashed var(--grey)}
.up-b{min-width:0;flex:1}
.up-t{font-weight:550;overflow-wrap:anywhere}
.up-p{font-size:11.5px;color:var(--muted)}
.up-m{font-size:12px;color:var(--muted);margin-top:2px}
.up-m i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.up.done{opacity:.8}.up.done .up-t{text-decoration:line-through}
.tick{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);background:transparent;cursor:pointer;position:relative;padding:0;margin:-2px 0}
.tick:hover{border-color:var(--green);background:color-mix(in srgb,var(--green) 15%,transparent)}
.tick.on{background:var(--done);border-color:var(--done)}
.tick.on::after{content:"";position:absolute;left:7.5px;top:3.5px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.side-foot{margin-top:22px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.empty-msg{color:var(--muted);padding:20px 4px}

/* ================================================================ sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:12px;z-index:20}
.sheet:focus{outline:none}
.sheet{background:var(--panel);border-radius:14px;width:min(580px,100%);max-height:92vh;overflow:auto;padding:18px 20px calc(18px + var(--safe-b));box-shadow:var(--shadow)}
.sheet h2{margin:2px 0 6px;font-size:18px;overflow-wrap:anywhere}
.sheet h3{font-size:14px;margin:18px 0 6px}
.kind{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.sec{margin:16px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650}
.field{display:block;margin:12px 0 0}
.field>span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input:not([type=checkbox]),.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-height:36px}
.row2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.field>span.dwrap,.dwrap{display:flex;gap:4px;margin:0}.dwrap input{flex:1;min-width:0}
.dwrap button{flex:none}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.preview{margin-top:12px;padding:8px 10px;border-radius:8px;background:var(--bg);font-size:13px}
.msgs{margin:8px 0 0;padding:0;list-style:none;font-size:13px;display:grid;gap:3px}
.msgs .e{color:var(--red)}.msgs .w{color:var(--amber)}
.acts{display:flex;gap:8px;margin-top:18px;align-items:center;flex-wrap:wrap}
.err{color:var(--red);font-size:13px;margin:10px 0 0;white-space:pre-line}
.deplist{max-height:160px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:grid;gap:2px;background:var(--bg)}
.deps{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.linkbtn{background:none;border:0;padding:2px 0;color:var(--accent);cursor:pointer;text-align:left}
.desc{white-space:pre-wrap;overflow-wrap:anywhere}
.status{padding:8px 10px;border-radius:8px;background:var(--bg);margin-top:12px;font-size:13px}
.status.st-overdue{color:var(--red)}.status.st-done{color:var(--muted)}
.subl{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.subl li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-top:1px solid var(--line2)}
.subl li:first-child{border-top:0}
.subl li .t{flex:1;min-width:0;cursor:pointer}
.subl li.done .t{text-decoration:line-through;color:var(--muted)}
.subl li.closed .t{text-decoration:line-through;color:var(--muted);opacity:.7}
.subl .d{font-size:12px;color:var(--muted);white-space:nowrap}
.subl input[type=checkbox]{width:18px;height:18px;accent-color:var(--done);margin:0}
.subl .mv{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 4px}
.subadd{display:flex;gap:6px;margin-top:6px}.subadd input{flex:1}
.c-late{color:var(--muted)}.c-done{color:var(--muted)}
.chip.newtag{border-style:dashed;color:var(--muted)}.chip.newtag::before{display:none}
.badge{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
.mrow{display:flex;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line2);flex-wrap:wrap}
.mrow input.txt{flex:1 1 140px;min-width:100px}
.swatch{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);padding:0;cursor:pointer;background:none;flex:none}
.prefs{display:grid;grid-template-columns:max-content 1fr;gap:8px 16px;align-items:center}
.prefs select,.prefs input{max-width:220px}


/* ---- item dialog (§19) */
.ed .field:first-of-type{margin-top:8px}
.ed-top{display:flex;align-items:center;gap:8px}
.dchips{gap:6px}
.dchip{min-height:34px;padding:4px 12px;font-size:13px}
.dchip::before{display:none}
.chip.dchip.on{background:color-mix(in srgb,var(--accent) 18%,var(--panel));border-color:var(--accent);font-weight:600}
.dpick{border-style:dashed;color:var(--muted);gap:6px}
.dinput{padding:2px 10px;font:inherit;font-size:13px;background:var(--panel);color:var(--ink);border-radius:999px}
.ed-line{font-size:13px;color:var(--muted);margin-top:8px}
.ed-line b{color:var(--ink)}
.ed-line.err-line{color:var(--red);font-weight:600}
.ed-secs{margin-top:16px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ed-head{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 12px;background:transparent;border:0;border-top:1px solid var(--line2);color:var(--ink);font:inherit;font-size:14px;text-align:left;cursor:pointer}
.ed-head:first-child{border-top:0}
.ed-head[aria-expanded=true]{background:var(--gband)}
.ed-head[aria-expanded=true] .ed-chev{transform:rotate(90deg)}
.ed-chev{color:var(--muted);flex:none;transition:transform .15s}
.ed-head span{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;display:inline-flex;align-items:center;gap:6px}
.ed-head span i{font-style:normal;opacity:.75}
.ed-head .sq{display:inline-block;width:8px;height:8px;border-radius:3px}
.ed-body{padding:4px 14px 16px;border-top:1px solid var(--line2)}
.chip.proj::before{border-radius:3px}
.pick{display:inline-flex;align-items:center;gap:2px;min-height:30px;padding:0 4px 0 12px;border-radius:999px;border:1px solid var(--line);background:var(--gband);font-size:13px}
.pick button{border:0;background:none;color:var(--muted);cursor:pointer;width:24px;height:24px;border-radius:50%;font-size:15px}
.ed-search{width:100%;margin-top:8px;background:var(--bg)}
.ed-results{margin-top:6px;border:1px solid var(--line);border-radius:9px;overflow:hidden;max-height:240px;overflow-y:auto}
.ed-grp{padding:6px 10px 3px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:1px solid var(--line2)}
.ed-grp:first-child{border-top:0}
.ed-res{display:flex;gap:8px;align-items:center;width:100%;padding:7px 10px;border:0;background:transparent;color:var(--ink);font:inherit;font-size:13.5px;text-align:left;cursor:pointer}
.ed-res:hover,.ed-res:focus-visible{background:var(--gband)}
.ed-res .plus{color:var(--muted);width:14px;text-align:center}
.ed-res mark{background:color-mix(in srgb,var(--accent) 28%,transparent);color:inherit;border-radius:3px}
.ed-foot{display:flex;align-items:center;gap:8px;margin-top:16px}
@media (max-width:760px){
  .dchip{min-height:40px;font-size:14px;padding:4px 14px}
  .ed-foot{position:sticky;bottom:calc(-18px - var(--safe-b));margin:16px -20px calc(-18px - var(--safe-b));padding:12px 20px calc(14px + var(--safe-b));background:var(--panel);border-top:1px solid var(--line);z-index:1}
  .ed-foot .btn{flex:1;justify-content:center;min-height:46px}
  .ed-foot .btn.primary{flex:2}
}


/* ---- item sheet (§20) */
.sh-head{display:flex;align-items:flex-start;gap:10px}
.sh-tt{flex:1;min-width:0}
.sh-tt h2{margin:0 0 6px}
.sh-line{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:14px;color:var(--muted)}
.sh-line b{color:var(--ink);font-weight:600}
.sh-line svg{overflow:visible;flex:none}
.dot-sep{color:var(--line);margin:0 2px}
.c-over{color:var(--red)}.c-soon{color:var(--amber)}
.pj{display:inline-flex;align-items:center;gap:5px}.pj i{width:8px;height:8px;border-radius:3px;display:inline-block}

<script>
"use strict";
/* =====================================================================
   1 CONFIG
   ===================================================================== */
const VERSION = '2.11-proto';
const SCHEMA = 4;
const ZOOMS = { day: 40, week: 12, month: 3.2, year: 0.9 };
const ZMIN = 0.5, ZMAX = 60;
const RH = 36, SH = 30, GH = 28, AXIS_H = 46;
const PALETTE = ['#2f6fed', '#d14d72', '#2e9e5b', '#c4762b', '#8a5cd6', '#0f8f9c', '#cf3f3b', '#8a8a1f', '#5f6f82', '#8d5b3f'];
const NOPROJ = '#8a8983';
const LS_STATE = 'tp2.state', LS_UI = 'tp2.ui';
const LIMITS = { title: 200, note: 500, notes: 4000, name: 60 };
const UI_DEFAULTS = {
  project: '', tags: [], showDone: true, showDeps: true, sort: 'due', group: true, showArchived: false, ppd: null, sideCollapsed: false,
  tab: null, expanded: [], labOpen: false,
  lab: { subrows: 'connector' }, legendOpen: true,
};

/* =====================================================================
   2 DATES  (pure)  — ISO "YYYY-MM-DD" <-> integer day numbers (UTC)
   ===================================================================== */
const DAY = 86400000;
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const pad = (n) => String(n).padStart(2, '0');
const ISO_RE = /^(\d{4})-(\d{2})-(\d{2})$/;
function isISO(s) {
  const m = typeof s === 'string' && ISO_RE.exec(s);
  if (!m) return false;
  const d = new Date(Date.UTC(+m[1], m[2] - 1, +m[3]));
  return d.getUTCFullYear() === +m[1] && d.getUTCMonth() === m[2] - 1 && d.getUTCDate() === +m[3];
}
const toDay = (s) => { const m = ISO_RE.exec(s); return Math.round(Date.UTC(+m[1], m[2] - 1, +m[3]) / DAY); };
const fromDay = (n) => new Date(n * DAY).toISOString().slice(0, 10);
const parts = (n) => { const o = new Date(n * DAY); return { y: o.getUTCFullYear(), m: o.getUTCMonth(), d: o.getUTCDate(), wd: o.getUTCDay() }; };
const ymd = (y, m, d) => Math.round(Date.UTC(y, m, d) / DAY);
function todayDay() { const n = new Date(); return toDay(`${n.getFullYear()}-${pad(n.getMonth() + 1)}-${pad(n.getDate())}`); }
/** add k months; clamp to the last day of the target month (Jan 31 + 1 → Feb 28/29) */
function addMonths(n, k) { const p = parts(n); const last = parts(ymd(p.y, p.m + k + 1, 0)).d; return ymd(p.y, p.m + k, Math.min(p.d, last)); }
function fmt(n, ref) { const p = parts(n); return `${MONTHS[p.m]} ${p.d}${ref == null || parts(ref).y === p.y ? '' : `, ${p.y}`}`; }
function rel(n, t) {
  const k = n - t;
  if (k === 0) return 'today'; if (k === 1) return 'tomorrow'; if (k === -1) return 'yesterday';
  const a = Math.abs(k);
  const u = a >= 730 ? `${Math.round(a / 365.25)} yr` : a >= 60 ? `${Math.round(a / 30.44)} mo` : a >= 14 ? `${Math.round(a / 7)} wk` : `${a} d`;
  return k < 0 ? `${u} ago` : `in ${u}`;
}
const dOrNull = (s) => (s ? toDay(s) : null);

/* =====================================================================
   3 MODEL  (pure)
   ===================================================================== */
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36));
const clone = (o) => (typeof structuredClone === 'function' ? structuredClone(o) : JSON.parse(JSON.stringify(o)));
const isHex = (s) => typeof s === 'string' && /^#[0-9a-f]{6}$/i.test(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/** local calendar day of createdAt (today if missing/invalid) */
function createdDay(i) { const d = new Date(i.createdAt); return isNaN(d) ? todayDay() : toDay(`${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`); }
/** default "not before" for an item with its own due: creation day, clamped to due. ISO string or null. */
const defaultNB = (i) => (i.due && isISO(i.due) ? fromDay(Math.min(createdDay(i), toDay(i.due))) : null);

const emptyState = () => ({ schemaVersion: SCHEMA, settings: { theme: 'system', weekStart: 1, dueSoonDays: 14 }, projects: [], tags: [], items: [], lastModifiedAt: null });

function baseItem(o = {}) {
  return {
    id: uid(), title: '', notes: '', parentId: null, projectId: null, tagIds: [],
    notBefore: null, due: null, bookedFor: null, completedAt: null,
    repeatMonths: null, repeatFrom: 'done', history: [], dependsOn: [], order: 0, createdAt: new Date().toISOString(), ...o,
  };
}

function normalize(s) {
  s.settings = { theme: 'system', weekStart: 1, dueSoonDays: 14, ...(s.settings || {}) };
  s.projects = s.projects || []; s.tags = s.tags || []; s.items = s.items || [];
  s.projects.forEach((p, i) => { p.archived = !!p.archived; if (typeof p.order !== 'number') p.order = i; p.name = String(p.name || '').trim(); });
  s.projects.sort((a, b) => a.order - b.order).forEach((p, i) => (p.order = i));
  s.tags.forEach((t) => (t.name = String(t.name || '').trim()));
  s.items = s.items.map((i) => {
    const x = baseItem({ ...i, id: i.id || uid() });
    x.title = String(x.title || '').trim();
    x.tagIds = [...new Set(x.tagIds || [])];
    x.dependsOn = [...new Set(x.dependsOn || [])];
    for (const k of ['notBefore', 'due', 'bookedFor', 'completedAt', 'parentId', 'projectId']) x[k] = x[k] || null;
    if (x.parentId) { x.projectId = null; x.repeatMonths = null; }
    if (x.repeatMonths != null) x.repeatMonths = Number(x.repeatMonths) || null;
    if (x.repeatFrom !== 'due') x.repeatFrom = 'done';
    x.history = (Array.isArray(x.history) ? x.history : []).map((h) => ({
      id: h.id || uid(), due: h.due || null, notBefore: h.notBefore || null, bookedFor: h.bookedFor || null,
      completedAt: h.completedAt || null, note: String(h.note || ''),
    })).sort((a, b) => (a.completedAt < b.completedAt ? -1 : 1));
    // schema 4: description + done note are one "notes" field
    const legacy = [x.description, x.note].map((v) => String(v || '').trim()).filter(Boolean).join('\n\n');
    x.notes = String(x.notes || '') || legacy;
    delete x.description; delete x.note;
    // v2.9: every item with its own due date is a window; the start defaults to the creation day (≤ due)
    if (!x.notBefore) x.notBefore = defaultNB(x);
    return x;
  });
  return s;
}

/* ---- index (cached per items array) */
const IDX = new WeakMap();
function idx(s, fresh = false) {
  let x = fresh ? null : IDX.get(s.items);
  if (!x) {
    const map = new Map(s.items.map((i) => [i.id, i]));
    const kids = new Map();
    for (const i of s.items) if (i.parentId) { if (!kids.has(i.parentId)) kids.set(i.parentId, []); kids.get(i.parentId).push(i); }
    for (const a of kids.values()) a.sort((p, q) => p.order - q.order || p.createdAt.localeCompare(q.createdAt));
    x = { map, kids };
    IDX.set(s.items, x);
  }
  return x;
}
const getItem = (s, id) => idx(s).map.get(id);
const kidsOf = (s, i) => idx(s).kids.get(i.id) || [];
const parentOf = (s, i) => (i.parentId ? getItem(s, i.parentId) : null);
const topOf = (s, i) => parentOf(s, i) || i;

/* ---- derived dates.  A sub-item with its own due/notBefore uses its own; otherwise it inherits the parent window. */
const ownWindow = (i) => i.due != null || i.notBefore != null;
const hasOwnDate = (i) => ownWindow(i) || i.bookedFor != null;
function effNB(s, i) { if (!i.parentId || ownWindow(i)) return dOrNull(i.notBefore); return dOrNull(parentOf(s, i)?.notBefore); }
function effDue(s, i) { if (i.due) return toDay(i.due); const p = parentOf(s, i); return p?.due ? toDay(p.due) : null; }
function nextDate(s, i, t) { const b = dOrNull(i.bookedFor); return b != null && b >= t ? b : effDue(s, i); }
const isLate = (s, i) => !!i.completedAt && toDay(i.completedAt) > effDue(s, i);
function outOfOrder(s, i) {
  if (!i.completedAt) return false;
  return i.dependsOn.some((id) => { const d = getItem(s, id); return d && (!d.completedAt || d.completedAt > i.completedAt); });
}
const subProgress = (s, i) => { const k = kidsOf(s, i); return { n: k.length, done: k.filter((x) => x.completedAt).length }; };
function shapeLabel(s, i) {
  const nb = effNB(s, i), du = effDue(s, i);
  const base = nb != null ? `Window · ${du - nb + 1} days` : 'Deadline';
  return i.parentId && !ownWindow(i) ? `Sub-item · parent’s window` : base;
}

/** status: done, closed, overdue, unconfirmed, soon, open (first match wins) */
function status(s, i, t) {
  if (i.completedAt) return 'done';
  if (parentOf(s, i)?.completedAt) return 'closed';
  if (effDue(s, i) < t) return 'overdue';
  if (i.bookedFor && toDay(i.bookedFor) < t) return 'unconfirmed';
  if (nextDate(s, i, t) <= t + s.settings.dueSoonDays) return 'soon';
  return 'open';
}
function itemColor(s, i) {
  const top = topOf(s, i);
  const p = s.projects.find((x) => x.id === top.projectId);
  if (p) return p.color;
  const tid = i.tagIds[0] || top.tagIds[0];
  return s.tags.find((x) => x.id === tid)?.color || NOPROJ;
}
function matches(s, i, ui) {
  const top = topOf(s, i);
  const p = s.projects.find((x) => x.id === top.projectId);
  if (p?.archived && !ui.showArchived) return false;
  if (ui.project === 'none' && p) return false;
  if (ui.project && ui.project !== 'none' && top.projectId !== ui.project) return false;
  if (ui.tags.length && ![...i.tagIds, ...top.tagIds].some((t) => ui.tags.includes(t))) return false;
  return true;
}

/* ---- rules */
function hasCycle(id, deps, lookup) {
  const seen = new Set(), st = [...deps];
  while (st.length) { const x = st.pop(); if (x === id) return true; if (seen.has(x)) continue; seen.add(x); const o = lookup(x); if (o) st.push(...o.dependsOn); }
  return false;
}
/** {errors:[], warnings:[]} for one item in the context of state s (s may not contain the item yet) */
function validateItem(s, i, t) {
  const E = [], W = [];
  const title = String(i.title || '').trim();
  if (!title) E.push('Title is required.'); else if (title.length > LIMITS.title) E.push('Title is too long.');
  for (const k of ['due', 'notBefore', 'bookedFor', 'completedAt']) if (i[k] != null && !isISO(i[k])) E.push(`Invalid date in “${k}”.`);
  if (E.length) return { errors: E, warnings: W };
  const others = new Map(s.items.filter((o) => o.id !== i.id).map((o) => [o.id, o]));
  const par = i.parentId ? others.get(i.parentId) : null;
  if (!i.parentId && !i.due) E.push('Due date is required.');
  if (String(i.notes || '').length > LIMITS.notes) E.push('Notes are too long.');
  if (i.parentId) {
    if (!par) E.push('Parent item not found.');
    else if (par.parentId) E.push('Sub-items can’t have sub-items.');
    if ([...others.values()].some((o) => o.parentId === i.id)) E.push('An item with sub-items can’t become a sub-item.');
    if (i.repeatMonths) E.push('Only top-level items can repeat.');
  }
  const due = i.due ? toDay(i.due) : par?.due ? toDay(par.due) : null;
  const nb = i.notBefore ? toDay(i.notBefore) : null;
  if (nb != null && due != null && nb > due) E.push('“Not before” must be on or before the due date.');
  if (i.repeatMonths != null && !(Number.isInteger(i.repeatMonths) && i.repeatMonths >= 1 && i.repeatMonths <= 60)) E.push('Repeat must be 1–60 months.');
  if (i.completedAt && t != null && toDay(i.completedAt) > t) E.push('Done date is in the future.');
  for (const h of i.history || []) {
    if (!isISO(h.completedAt) || (h.due && !isISO(h.due))) { E.push('Invalid date in history.'); break; }
    if (t != null && toDay(h.completedAt) > t) { E.push('A history date is in the future.'); break; }
  }
  if (i.projectId && !s.projects.some((p) => p.id === i.projectId)) E.push('Unknown project.');
  if (i.tagIds.some((x) => !s.tags.some((g) => g.id === x))) E.push('Unknown tag.');
  if (i.dependsOn.includes(i.id)) E.push('An item can’t depend on itself.');
  else if (i.dependsOn.some((d) => !others.has(d))) E.push('Depends on an item that doesn’t exist.');
  else if (hasCycle(i.id, i.dependsOn, (x) => (x === i.id ? i : others.get(x)))) E.push('These dependencies would create a cycle.');
  // soft
  if (par && par.due) {

/* ---- repeat: one item, past occurrences in i.history.  Mutates the draft. */

/* ---- v1 → v2 conversion */
function convertV1(d) {

    const cps = [...(it.checkpoints || [])].sort((a, b) => (a.due < b.due ? -1 : 1));
    const common = { id: it.id, title: it.title, description: it.description || '', projectId: it.projectId || null, tagIds: it.tagIds || [], dependsOn: it.dependsOn || [], createdAt: it.createdAt || new Date().toISOString() };

      const last = cps.map((c) => c.completedAt).filter(Boolean).sort().pop() || null;
      out.items.push(baseItem({ ...common, notBefore: it.start, due: cps[cps.length - 1].due, completedAt: allDone ? last : null }));
      cps.forEach((c, k) => out.items.push(baseItem({ parentId: it.id, title: `${it.title} #${k + 1}`, due: c.due, completedAt: c.completedAt || null, note: c.note || '', order: k })));
    } else {
      const c = cps[0] || {};

    const keep = open.length ? open[open.length - 1] : g[g.length - 1];
    keep.history = keep.history || [];

    for (const i of open) if (i !== keep) { remap.set(i.id, keep.id); drop.add(i.id); }
    if (keep.completedAt) { // nothing open: turn the last one into history and move on
      keep.history.push({ id: uid(), due: keep.due, notBefore: keep.notBefore || null, bookedFor: keep.bookedFor || null, completedAt: keep.completedAt, note: keep.note || '' });

/* ---- timeline range */
function timelineRange(s, t) {
  let mn = t - 60, mx = t + 240;
  for (const i of s.items) {
    for (const d of [effNB(s, i), effDue(s, i), dOrNull(i.bookedFor), dOrNull(i.completedAt), ...i.history.map((h) => toDay(h.completedAt))]) if (d != null) { mn = Math.min(mn, d); mx = Math.max(mx, d); }

  }

let saveT = 0;

/* ---- mutations used by the UI */
function completeItem(id, date, alsoSubs = false) {
  update((d) => {
    const i = d.items.find((x) => x.id === id);
    if (isRepeating(i)) { advanceRepeat(d, i, date); return; }
    i.completedAt = date;

  });

  const date = defaultDoneDate(i);
  const rep = isRepeating(i);
  completeItem(id, date);
  if (!toastIt) return;
  const n = getItem(S, id);
  toast(rep ? `Done ${fmt(toDay(date), TODAY)} · next due ${fmt(toDay(n.due), TODAY)}` : `Done: ${i.title}`, {
    action: 'Undo', timeout: 7000,
    onAction: () => { try { update((d) => { const x = d.items.find((y) => y.id === id); if (rep) undoRepeat(x); else x.completedAt = null; }); } catch (ex) { toast(ex.errors?.[0] || ex.message, { error: true }); } },
  });
}
const tickRepeating = (id) => tickItem(id);
const defaultDoneDate = (i) => (i.bookedFor && toDay(i.bookedFor) <= TODAY ? i.bookedFor : fromDay(TODAY));

const $ = (q, r = document) => r.querySelector(q);
const $$ = (q, r = document) => [...r.querySelectorAll(q)];
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ESC[c]);
const isPhone = () => matchMedia('(max-width:760px)').matches;

/** '?' tile on the timeline: native date picker at the pointer, preset to the tile's day; picking saves (toast with Undo) */
function quickSchedule(id, day, cx, cy) {
  pickDate({ value: fromDay(day), x: cx, y: cy, onPick: (v) => {
    try { update((d) => { d.items.find((y) => y.id === id).bookedFor = v; }); } catch (ex) { return toast(ex.errors?.[0] || ex.message, { error: true }); }
    toast(`Scheduled ${fmt(toDay(v), TODAY)}`, { action: 'Undo', onAction: () => { try { update((d) => { const y = d.items.find((z) => z.id === id); if (y) y.bookedFor = null; }); } catch { /* gone */ } }, timeout: 7000 });

/* dates are only ever picked, never typed: any date field opens the picker on click / Space / Enter-less keys are swallowed */
document.addEventListener('click', (e) => {

function pickDate({ value, min, max, x, y, onPick }) {

  if (min) inp.min = min; if (max) inp.max = max;
  inp.style.left = `${x}px`; inp.style.top = `${y}px`;

function toast(msg, { action, onAction, timeout = 4500, error = false } = {}) {
  const el = document.createElement('div');
  el.className = `toast${error ? ' error' : ''}`;
  el.innerHTML = `<span class="sp">${esc(msg)}</span>${action ? `<button data-a>${esc(action)}</button>` : ''}<button data-x aria-label="Dismiss">✕</button>`;
  el.querySelector('[data-x]').onclick = () => el.remove();

/* ---- sheet (modal / bottom sheet) */
let lastFocus = null;
const sheetOpen = () => !$('#ov').hidden;

   ===================================================================== */
const R = { mn: null, mx: null, ppd: 12, W: 0, H: 0, rows: [], itemRows: [], rowOf: new Map(), bg: [0, 0], fg: [0, 0], ticks: { L: [], U: [] }, scrolled: false, raf: 0 };
const tier = (p) => (p >= 24 ? 'day' : p >= 6 ? 'week' : p >= 1.5 ? 'month' : 'year');
const curPpd = () => clamp(UI.ppd ?? ZOOMS.week, ZMIN, ZMAX);
const X = (d) => (d - R.mn) * R.ppd;
const chart = () => $('#chartWrap');
const tlVisible = () => chart().clientWidth > 0;

function ticks(d0, d1, ppd, weekStart) {
  const t = tier(ppd), L = [], p0 = parts(d0);
  const U = [t === 'day' || t === 'week' ? ymd(p0.y, p0.m, 1) : ymd(p0.y, 0, 1)];
  for (let d = d0; d <= d1; d++) {
    const p = parts(d), ms = p.d === 1;
    if (t === 'day') { L.push({ d, label: String(p.d), we: p.wd === 0 || p.wd === 6 }); if (ms && d !== U[0]) U.push(d); }
    else if (t === 'week') { if (p.wd === weekStart) L.push({ d, label: String(p.d) }); if (ms && d !== U[0]) U.push(d); }
    else if (t === 'month') { if (ms) L.push({ d, label: MONTHS[p.m] }); if (ms && p.m === 0 && d !== U[0]) U.push(d); }
    else { if (ms && p.m % 3 === 0) L.push({ d, label: `Q${p.m / 3 + 1}` }); if (ms && p.m === 0 && d !== U[0]) U.push(d); }
  }
  const ul = (d) => (t === 'day' || t === 'week' ? `${MONTHS[parts(d).m]} ${parts(d).y}` : String(parts(d).y));
  return { L, U: U.map((d) => ({ d, label: ul(d) })) };
}

/* ---- icon set: flag = deadline, calendar tile = booked, check = done.  Color only for what needs attention. */
function flag(x, y, cls, sc = 1, tip = '') {
  const h = 10 * sc, b = 9 * sc;
  return `<g class="flag ${cls}">${tip ? `<title>${esc(tip)}</title>` : ''}<line x1="${x}" x2="${x}" y1="${y - h - 1}" y2="${y + b}"/><path d="M${x},${y - h - 1} L${x + 11 * sc},${y - h + 3 * sc} L${x},${y - h + 7 * sc} Z"/></g>`;
}
function tile(x, y, day, cls, sc = 1, tip = '') {
  const w = 18 * sc, h = 19 * sc, unc = cls.includes('unc'), ask = unc || cls.includes('ask');
  return `<g class="tile ${cls}">${tip ? `<title>${esc(tip)}</title>` : ''}<rect class="tb" x="${x - w / 2}" y="${y - h / 2}" width="${w}" height="${h}" rx="${3 * sc}"/>`
    + (unc ? '' : `<rect class="band" x="${x - w / 2}" y="${y - h / 2}" width="${w}" height="${5 * sc}" rx="${2 * sc}"/>`)
    + `<text x="${x}" y="${y + 6 * sc}" text-anchor="middle" style="font-size:${(ask ? 10.5 : 9.5) * sc}px">${ask ? '?' : day}</text></g>`;
}
const subBox = (x, y) => `<rect class="sub-box" x="${x - 4}" y="${y - 4}" width="8" height="8" rx="1.8"/>`;
function checkMark(x, y, r, cls = '', tip = '') {
  return `<g class="ck-i ${cls}">${tip ? `<title>${esc(tip)}</title>` : ''}<circle cx="${x}" cy="${y}" r="${r}"/>${r >= 4.5 ? `<path d="M${x - r * .45},${y + r * .05} l${r * .32},${r * .32} l${r * .6},${-r * .62}"/>` : ''}</g>`;
}

function drawItem(s, i, cy, rowType) {
  const t = TODAY, c = itemColor(s, i), st = status(s, i, t);
  const isSub = rowType === 's';
  const ghost = isSub && !ownWindow(i);
  const sc = isSub ? 0.85 : 1;
  const nb = effNB(s, i), du = effDue(s, i);
  const xs = [];
  let g = '';
  // window bar (project color carries "what it belongs to", not urgency)
  if (nb != null) {
    const x0 = X(nb), x1 = X(du + 1);
    xs.push(x0, x1);
    const by = cy - 8 * sc, bh = 16 * sc, bw = Math.max(x1 - x0, 2);
    // past part (up to today, or all of it once done) = dashed grey outline; the rest in the project colour
    const cut = i.completedAt ? x1 : clamp(X(t + 0.5), x0, x1); // middle of today = today line
    const cid = `c${rowType}${i.id}`.replace(/[^\w-]/g, '');
    if (ghost || cut <= x0) g += `<rect x="${x0}" y="${by}" width="${bw}" height="${bh}" rx="4" class="bar${ghost ? ' ghost' : ''}" style="fill:${c};stroke:${c}"/>`;
    else {
      g += `<clipPath id="p${cid}"><rect x="${x0 - 2}" y="${by - 2}" width="${cut - x0 + 2}" height="${bh + 4}"/></clipPath>`
        + `<rect x="${x0 + .6}" y="${by + .6}" width="${bw - 1.2}" height="${bh - 1.2}" rx="4" class="bar-past" clip-path="url(#p${cid})"/>`;
      if (cut < x1) g += `<clipPath id="f${cid}"><rect x="${cut}" y="${by - 2}" width="${x1 - cut + 2}" height="${bh + 4}"/></clipPath>`
        + `<rect x="${x0}" y="${by}" width="${bw}" height="${bh}" rx="4" class="bar" style="fill:${c};stroke:${c}" clip-path="url(#f${cid})"/>`;
    }
  }
  // deadline flag
  const dx = X(du + 0.5);
  xs.push(dx, dx + 11 * sc);
  const dueTip = `${i.title} — due ${fmt(du, t)}`;
  if (ghost) { if (nb == null) g += flag(dx, cy, 'ghost', sc); }
  else if (i.completedAt) { if (isLate(s, i)) g += flag(dx, cy, 'faded', sc, dueTip); }
  else {
    const cls = st === 'closed' ? 'faded' : du < t ? 'overdue' : du <= t + s.settings.dueSoonDays ? 'soon' : 'open';
    g += flag(dx, cy, cls, sc, dueTip);
  }
  // booking: calendar tile with the day number (gone once done: the tick says it)
  if (i.bookedFor && !i.completedAt) {
    const b = toDay(i.bookedFor), bx = X(b + 0.5);
    xs.push(bx - 9, bx + 9);
    const unc = b < t;
    g += tile(bx, cy, parts(b).d, unc ? 'unc' : '', sc, `${i.title} — scheduled ${fmt(b, t)}${unc ? ' · not ticked yet' : ''}`);
  } else if (!isSub && !i.completedAt && (st === 'open' || st === 'soon') && !kidsOf(s, i).length) {
    // not scheduled yet: faint '?' tile in the middle of what's left of the window; click = quick schedule
    const lo = Math.max(t, nb ?? t), mid = Math.floor((lo + du) / 2), qx = X(mid + 0.5);
    xs.push(qx - 9, qx + 9);
    g += `<g class="sched-q" data-sched="${esc(i.id)}" data-day="${mid}">${tile(qx, cy, 0, 'ask', sc, `${i.title} — not scheduled · click to schedule`)}</g>`;
  }
  // done
  if (i.completedAt) {
    const cd = toDay(i.completedAt), cx = X(cd + 0.5);
    xs.push(cx);
    g += checkMark(cx, cy, 7 * sc, '', `${i.title} — done ${fmt(cd, t)}`);
  }
  // past occurrences of a repeating item
  for (const hh of i.history) {
    const hx = X(toDay(hh.completedAt) + 0.5);
    xs.push(hx);
    g += checkMark(hx, cy, 6 * sc, '', `${i.title} — done ${fmt(toDay(hh.completedAt), t)}${hh.note ? ` · ${hh.note}` : ''}`);
  }
  // sub-items on a collapsed parent: centred on the row; open = small square box, done = small round tick
  if (!isSub && !expanded(i.id)) {
    const kids = kidsOf(s, i);
    const undated = kids.filter((k) => !k.completedAt && !hasOwnDate(k));
    let lo = nb != null ? Math.max(t, nb) : t;
    if (lo > du) lo = nb != null ? nb : du - 14;          // window already over: use all of it
    const span = du + 1 - lo;
    let u = 0;
    for (const k of kids) {
      let x, mk;
      if (k.completedAt) { x = X(toDay(k.completedAt) + 0.5); mk = checkMark(x, cy, 4.8, 'mini'); }
      else if (i.completedAt) continue;                    // closed with the parent: stay quiet
      else if (hasOwnDate(k)) { x = X(nextDate(s, k, t) + 0.5); mk = subBox(x, cy); }
      else { u += 1; x = X(lo + span * u / (undated.length + 1)); mk = subBox(x, cy); }
      xs.push(x);
      const tip = k.completedAt ? `${k.title} — done ${fmt(toDay(k.completedAt), t)}` : `${k.title}${hasOwnDate(k) ? ` — ${fmt(nextDate(s, k, t), t)}` : ' — open'}`;
      g += `<g class="sub-mk" data-id="${esc(k.id)}"><title>${esc(tip)}</title>${mk}</g>`;
    }

  const lo = Math.min(...xs), hi = Math.max(...xs);
  const pr = !isSub ? subProgress(s, i) : null;
  const label = `${i.title}${pr?.n ? ` · ${pr.done}/${pr.n}` : ''}${i.repeatMonths ? ' ↻' : ''}`;
  return `<g class="it ${st}" data-id="${esc(i.id)}" tabindex="0" role="button" aria-label="${esc(`${i.title}, ${st}`)}"><rect x="${lo - 12}" y="${cy - 14}" width="${hi - lo + 24}" height="28" rx="6" class="hit"/>${g}<text x="${hi + 10}" y="${cy + 4}" class="tl-lbl">${esc(label)}</text></g>`;
}

const expanded = (id) => UI.expanded.includes(id);

function buildRows(s) {
  const vis = s.items.filter((i) => !i.parentId && matches(s, i, UI) && (UI.showDone || !i.completedAt));
  const KEYS = {
    due: (i) => effDue(s, i),
    next: (i) => nextDate(s, i, TODAY),
    start: (i) => effNB(s, i) ?? effDue(s, i),
  };
  const key = KEYS[UI.sort] || KEYS.due;
  // open items by the chosen date; done items last, by done date; ties: due date, then title
  const sorter = (a, b) => {
    const ad = !!a.completedAt, bd = !!b.completedAt;
    if (ad !== bd) return ad ? 1 : -1;
    return (ad ? a.completedAt.localeCompare(b.completedAt) : key(a) - key(b)) || effDue(s, a) - effDue(s, b) || a.title.localeCompare(b.title);
  };
  let groups;
  if (UI.group) {
    groups = s.projects.filter((p) => !p.archived || UI.showArchived).map((p) => ({ p, items: vis.filter((i) => i.projectId === p.id) }));
    groups.push({ p: null, items: vis.filter((i) => !s.projects.some((p) => p.id === i.projectId)) });
  } else groups = [{ flat: true, items: vis }];
  const rows = []; let y = 0;
  for (const g of groups) {
    if (!g.items.length) continue;
    if (!g.flat) { rows.push({ type: 'g', p: g.p, y, h: GH }); y += GH; }
    for (const i of g.items.sort(sorter)) {
      rows.push({ type: 'i', it: i, y, h: RH }); y += RH;
      if (expanded(i.id)) for (const k of kidsOf(s, i)) { rows.push({ type: 's', it: k, y, h: SH }); y += SH; }
    }
  }
  return { rows, height: y };
}

function renderTimeline() {
  const cw = chart();

  lab.innerHTML = rows.map((r) => {

    const i = r.it, st = status(S, i, TODAY);

      + `<b class="dot"></b><span class="t">${esc(i.title)}</span>${pr.n ? `<span class="cnt">${pr.done}/${pr.n}</span>` : ''}${i.repeatMonths ? '<span class="cnt" title="Repeats">↻</span>' : ''}</div>`;

/** row for an item; collapsed sub-items map to their parent row */
const rowFor = (i) => R.rowOf.get(i.id) || (i.parentId ? R.rowOf.get(i.parentId) : null);
/* ---- dependency connectors: rounded elbows (spec §18.2) */
function depOutX(s, i) {
  if (i.completedAt) return X(toDay(i.completedAt) + 0.5) + 8;
  return effNB(s, i) != null ? X(effDue(s, i) + 1) : X(effDue(s, i) + 0.5) + 4;
}
function depInX(s, i, early) {
  if (early) return X(toDay(i.completedAt) + 0.5) - 10;
  const nb = effNB(s, i);
  if (nb != null) return X(nb) - 4;
  const b = dOrNull(i.bookedFor);
  return Math.min(X(effDue(s, i) + 0.5) - 7, b != null ? X(b + 0.5) - 13 : Infinity);
}
function elbowPath(x1, y1, x2, y2, gap) {
  const R = 5, dy = Math.sign(y2 - y1) || 1, xm = x1 + 8;
  if (x2 - x1 >= 16) {
    return `M${x1},${y1}H${xm - R}Q${xm},${y1} ${xm},${y1 + dy * R}V${y2 - dy * R}Q${xm},${y2} ${xm + R},${y2}H${x2}`;
  }
  // target starts earlier: step back along the gap between rows
  const yb = y1 + dy * gap, xl = Math.min(x2 - 10, xm - 2 * R);
  return `M${x1},${y1}H${xm - R}Q${xm},${y1} ${xm},${y1 + dy * R}V${yb - dy * R}Q${xm},${yb} ${xm - R},${yb}`
    + `H${xl + R}Q${xl},${yb} ${xl},${yb + dy * R}V${y2 - dy * R}Q${xl},${y2} ${xl + R},${y2}H${x2}`;
}
const chevron = (x, y, cls) => `<path d="M${x - 5},${y - 4}L${x},${y}L${x - 5},${y + 4}" class="dep-ch ${cls}"/>`;

function renderFg() {
  const cw = chart(), st = cw.scrollTop, h = Math.max(cw.clientHeight, 400);
  const y0 = st - h, y1 = st + 2 * h;
  R.fg = [Math.max(0, y0), y1];
  const near = (r) => r.y + r.h >= y0 && r.y <= y1;
  let deps = '', items = '';
  for (const r of R.itemRows) if (near(r)) items += drawItem(S, r.it, r.y + r.h / 2, r.type);
  for (const i of S.items) {
    if (!UI.showDeps || !i.dependsOn.length) continue;
    const rb = rowFor(i); if (!rb) continue;
    for (const pid of i.dependsOn) {
      const p = getItem(S, pid); const ra = p && rowFor(p);
      if (!ra || ra === rb) continue;
      if (!(near(ra) || near(rb) || (ra.y < y0 && rb.y > y1) || (rb.y < y0 && ra.y > y1))) continue;
      const early = outOfOrder(S, i) && (!p.completedAt || p.completedAt > i.completedAt);
      const ax = depOutX(S, p), ay = ra.y + ra.h / 2, by = rb.y + rb.h / 2;
      let bx = depInX(S, i, early);
      if (i.parentId && !hasOwnDate(i) && !early) bx = ax + 30; // undated sub: "somewhere after"
      // open: dark solid · finished: light solid · done before its prerequisite: light dotted
      const cls = early ? 'early' : p.completedAt ? 'fin' : 'open';
      deps += `<g><title>${esc(`${p.title} → ${i.title}${early ? ' (done before it)' : ''}`)}</title><path d="${elbowPath(ax, ay, bx, by, ra.h / 2)}" class="dep ${cls}"/>${chevron(bx, by, cls)}</g>`;
    }
  }
  $('#tlDeps', cw).innerHTML = deps;
  $('#tlItems', cw).innerHTML = items;
}
const needsFg = () => { const cw = chart(); return cw.scrollTop < R.fg[0] || cw.scrollTop + cw.clientHeight > R.fg[1]; };

function bgRange() {
  const cw = chart(), sl = cw.scrollLeft, w = Math.max(cw.clientWidth, 400);

}
function needsBg() {

function syncScroll() {

function setZoom(ppd, clientX) {

function dateText(s, i, t) {

}
function upRow(s, i, t) {

function renderUpcoming() {

const icoTick = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.5L5.5 10.5L11.5 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const icoEdit = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M9.5 2L12 4.5L5 11.5L2 12L2.5 9Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>';
const icoUndo = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M4 3L1.5 5.5L4 8M1.5 5.5H8.5A3.5 3.5 0 0 1 8.5 12.5H6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const icoDots = '<svg width="16" height="4" viewBox="0 0 16 4" aria-hidden="true"><circle cx="2" cy="2" r="1.6" fill="currentColor"/><circle cx="8" cy="2" r="1.6" fill="currentColor"/><circle cx="14" cy="2" r="1.6" fill="currentColor"/></svg>';

function openDetail(id, opts = {}) {
  if (SHEET.id !== id) Object.assign(SHEET, { id, justDone: false, book: false, addSub: false, addNote: false, menu: false });
  Object.assign(SHEET, opts);
  const s = S, t = TODAY, i = getItem(s, id);
  if (!i) return closeSheet();
  const st = status(s, i, t), par = parentOf(s, i), kids = kidsOf(s, i), rep = isRepeating(i);
  const du = effDue(s, i), nb = effNB(s, i);
  const top = topOf(s, i), proj = s.projects.find((p) => p.id === top.projectId);
  const deps = i.dependsOn.map((d) => getItem(s, d)).filter(Boolean);
  const blocks = s.items.filter((o) => o.dependsOn.includes(i.id));
  const doneState = !!i.completedAt || (rep && SHEET.justDone && i.history.length > 0);

  /* header: title + one status line */
  const flagCls = i.completedAt || st === 'closed' ? 'faded' : st === 'overdue' ? 'overdue' : st === 'soon' ? 'soon' : 'open';
  const line = [];
  if (par) line.push(`in <button type="button" class="linkbtn" data-open="${esc(par.id)}">${esc(par.title)}</button>`);
  if (i.completedAt) {
    const late = isLate(s, i) ? ` · ${toDay(i.completedAt) - du} d late` : '';
    line.push(`<b>Done ${fmt(toDay(i.completedAt), t)}</b>${late}`);
  } else if (st === 'closed') line.push('Closed with its parent');
  else if (rep && SHEET.justDone) line.push(`Next due <b>${fmt(du, t)}</b> · ${rel(du, t)}`);
  else if (st === 'overdue') line.push(`<span class="c-over">Overdue · due ${fmt(du, t)} (${rel(du, t)})</span>`);
  else if (nb != null && nb < du && !(par && !ownWindow(i))) line.push(`${fmt(nb, t)} – <b>${fmt(du, t)}</b> · ${rel(du, t)}`);
  else if (par && !ownWindow(i)) line.push(`somewhere in ${nb != null ? `${fmt(nb, t)} – ` : 'by '}${fmt(du, t)}`);
  else line.push(`Due <b>${fmt(du, t)}</b> · ${rel(du, t)}`);
  if (i.bookedFor && !i.completedAt) {
    const b = toDay(i.bookedFor), unc = b < t;
    line.push(`<span class="bchip${unc ? ' unc' : ''}">${icoCal}scheduled ${fmt(b, t)}${unc ? ' · not ticked yet' : ''}<button type="button" data-unbook aria-label="Unschedule">✕</button></span>`);
  }
  if (proj) line.push(`<span class="pj"><i style="background:${proj.color}"></i>${esc(proj.name)}</span>`);
  if (!par && kids.length) { const pr = subProgress(s, i); line.push(`${pr.done} of ${pr.n} done`); }
  const tags = i.tagIds.map((x) => s.tags.find((g) => g.id === x)).filter(Boolean);
  const chips = [...tags.map((g) => `<span class="chip static small-chip" style="--c:${g.color}">${esc(g.name)}</span>`),
    ...(rep ? [`<span class="badge">↻ every ${i.repeatMonths} mo · from ${i.repeatFrom === 'due' ? 'due' : 'done'} date</span>`] : [])];

  let h = `<div class="sh-head"><div class="sh-tt"><h2>${esc(i.title)}</h2>
      <div class="sh-line"><svg width="14" height="16" viewBox="0 0 14 22" aria-hidden="true">${flag(3, 12, flagCls)}</svg>${line.join('<span class="dot-sep">·</span>')}</div>
      ${chips.length ? `<div class="chips" style="margin-top:6px">${chips.join('')}</div>` : ''}</div>
    <button type="button" class="btn icon ghost" data-x aria-label="Close">✕</button></div>`;

  /* inline rows: done-on (scheduling opens the date picker directly from the Schedule button) */
  if (doneState) {
    const cur = i.completedAt || i.history[i.history.length - 1]?.completedAt;
    const openKids = kids.filter((k) => !k.completedAt);
    h += `<div class="inl-row">${icoCheck(9)}<label>Done on <input type="date" data-doneon value="${esc(cur)}" max="${fromDay(t)}"></label>
      <span class="muted sm">change if it was another day</span>
      ${i.completedAt && openKids.length ? `<span class="sp"></span><button type="button" class="linkbtn sm" data-also-subs>also tick ${openKids.length} open sub-item${openKids.length > 1 ? 's' : ''}</button>` : ''}</div>`;
  }

  /* sections (only with content) */
  if (!par && (kids.length || SHEET.addSub)) {
    h += `<div class="sec">Sub-items</div><div class="subl2">${kids.map((k, n) => {
      const kst = status(s, k, t);
      const d = k.completedAt ? `done ${fmt(toDay(k.completedAt), t)}` : hasOwnDate(k) ? (k.bookedFor ? `scheduled ${fmt(toDay(k.bookedFor), t)}` : `by ${fmt(effDue(s, k), t)}`) : '';
      const dc = !k.completedAt && kst === 'overdue' ? ' c-over' : !k.completedAt && kst === 'soon' ? ' c-soon' : '';
      return `<div class="srow ${kst}"><button type="button" class="sbox" data-subtick="${esc(k.id)}" aria-label="${k.completedAt ? 'Undo' : 'Done'}: ${esc(k.title)}">${k.completedAt ? icoCheck(9) : icoBox()}</button>
        <button type="button" class="linkbtn sname" data-open="${esc(k.id)}">${esc(k.title)}</button><span class="d${dc}">${d}</span>
        <span class="mv"><button type="button" data-mv="${esc(k.id)}|-1" ${n === 0 ? 'disabled' : ''} aria-label="Move up">↑</button><button type="button" data-mv="${esc(k.id)}|1" ${n === kids.length - 1 ? 'disabled' : ''} aria-label="Move down">↓</button></span></div>`;
    }).join('')}<form class="srow add" data-subadd><span class="plus">+</span><input name="t" placeholder="Add sub-item…" maxlength="${LIMITS.title}" aria-label="New sub-item" autocomplete="off"><button type="button" class="btn small ghost" data-subfull>More…</button></form></div>`;
  }
  if (deps.length || blocks.length) {
    h += '<div class="order">';
    if (deps.length) h += `<div><span class="muted">After:</span> ${deps.map((d) => `${d.completedAt ? '✓ ' : ''}<button type="button" class="linkbtn" data-open="${esc(d.id)}">${esc(d.title)}</button>`).join(', ')}${outOfOrder(s, i) ? ' <span class="muted sm">· done before it</span>' : ''}</div>`;
    if (blocks.length) h += `<div><span class="muted">Before:</span> ${blocks.map((d) => `<button type="button" class="linkbtn" data-open="${esc(d.id)}">${esc(d.title)}</button>`).join(', ')}</div>`;
    h += '</div>';
  }
  if (i.notes || SHEET.addNote) {
    h += `<div class="sec">Notes</div><textarea class="notes-ta" data-notes rows="${Math.min(10, Math.max(2, i.notes.split('\n').length + 1))}" maxlength="${LIMITS.notes}" placeholder="Anything worth remembering…" aria-label="Notes">${esc(i.notes)}</textarea>`;
  }
  if (i.history.length) {
    h += `<div class="sec">History · ${i.history.length}×</div><div class="chips">${[...i.history].reverse().map((hh) => {
      const late = hh.due && hh.completedAt > hh.due;
      return `<button type="button" class="chip hchip" data-hist="${esc(hh.id)}" title="${esc(`done ${fmt(toDay(hh.completedAt), t)}${hh.due ? ` · due ${fmt(toDay(hh.due), t)}` : ''}${late ? ' (late)' : ''}${hh.note ? ` · ${hh.note}` : ''}`)}">${icoCheck(5.5, 'mini')}${fmt(toDay(hh.completedAt), t)}${hh.note ? ' <span class="muted" aria-label="has a note">✎</span>' : ''}</button>`;
    }).join('')}</div>`;
  }
  const quiet = [];
  if (!par && !kids.length && !SHEET.addSub) quiet.push('<button type="button" class="linkbtn quiet" data-add-sub>+ Sub-item</button>');
  if (!i.notes && !SHEET.addNote) quiet.push('<button type="button" class="linkbtn quiet" data-add-note>+ Note</button>');
  if (quiet.length) h += `<div class="quiet-row">${quiet.join('<span class="dot-sep">·</span>')}</div>`;

  /* actions */
  let acts;
  if (doneState) acts = `<button type="button" class="btn" data-undo>${icoUndo}Undo</button>`;
  else if (st === 'closed') acts = '';
  else acts = `<button type="button" class="btn primary" data-done>${icoTick}Done</button><button type="button" class="btn" data-book>${icoCal}${i.bookedFor ? 'Reschedule' : 'Schedule'}</button>`;
  const menu = SHEET.menu ? `<div class="menu" role="menu"><button type="button" role="menuitem" data-m="dup">Duplicate</button>
      ${rep && i.history.length && !SHEET.justDone ? '<button type="button" role="menuitem" data-m="undolast">Undo last done</button>' : ''}
      <div class="menu-sep"></div><button type="button" role="menuitem" class="danger" data-m="del">Delete…</button></div>` : '';
  h += `<div class="sh-acts">${acts}<button type="button" class="btn" data-edit>${icoEdit}Edit</button><span class="sp"></span>
    <span class="menu-wrap"><button type="button" class="btn icon${SHEET.menu ? ' on' : ''}" data-more aria-label="More actions" aria-expanded="${SHEET.menu}">${icoDots}</button>${menu}</span></div>`;

  const prevScroll = sheetOpen() && $('#sheet').dataset.item === id ? $('#sheet').scrollTop : 0;
  const sh = openSheet(h, i.title, { focus: false });
  sh.dataset.item = id;
  sh.scrollTop = prevScroll;
  const again = (o = {}) => openDetail(id, o);

  // autofocus for the inline things the user just asked for
  if (SHEET.addNote && !i.notes) $('[data-notes]', sh)?.focus();
  if (SHEET.addSub && !kids.length) $('[data-subadd] input', sh)?.focus();

  let noteT = 0;
  sh.oninput = (e) => {
    if (e.target.matches('[data-notes]')) {
      const v = e.target.value;
      e.target.rows = Math.min(10, Math.max(2, v.split('\n').length + 1));
      clearTimeout(noteT);
      noteT = setTimeout(() => { try { update((d) => { d.items.find((x) => x.id === id).notes = v; }); } catch (ex) { toast(ex.errors?.[0] || ex.message, { error: true }); } }, 400);
    }
  };
  sh.onchange = (e) => {
    const x = e.target;
    if (x.matches('[data-doneon]') && isISO(x.value)) {
      if (toDay(x.value) > TODAY) { toast('The date is in the future.', { error: true }); return again(); }
      update((d) => { const y = d.items.find((z) => z.id === id); if (y.completedAt) y.completedAt = x.value; else if (y.history.length) y.history[y.history.length - 1].completedAt = x.value; });
      return again();
    }
  };
  sh.onsubmit = (e) => {
    const f = e.target.closest('[data-subadd]'); if (!f) return;
    e.preventDefault();
    const title = f.elements.t.value.trim(); if (!title) return;
    try { update((d) => { d.items.push(baseItem({ parentId: id, title, order: kids.length })); }); } catch (ex) { return toast(ex.errors?.[0] || ex.message, { error: true }); }
    again({ addSub: true });
    $('#sheet [data-subadd] input')?.focus();
  };
  sh.onclick = async (e) => {
    const b = e.target.closest('button'); if (!b) { if (SHEET.menu && !e.target.closest('.menu')) again({ menu: false }); return; }
    const ds = b.dataset;
    if ('x' in ds) return closeSheet();
    if (ds.open) return openDetail(ds.open);
    if ('more' in ds) return again({ menu: !SHEET.menu });
    if (SHEET.menu && !ds.m) SHEET.menu = false;
    if ('done' in ds) { tickItem(id, { toastIt: false }); return again({ justDone: true, book: false }); }
    if ('undo' in ds) {
      update((d) => { const y = d.items.find((z) => z.id === id); if (y.completedAt) y.completedAt = null; else undoRepeat(y); });
      return again({ justDone: false });
    }
    if ('book' in ds) {
      const r = b.getBoundingClientRect(), nb0 = effNB(S, i) ?? TODAY;
      pickDate({ value: i.bookedFor || fromDay(Math.max(TODAY, nb0)), x: r.left, y: r.top, onPick: (v) => {
        try { update((d) => { d.items.find((y) => y.id === id).bookedFor = v; }); } catch (ex) { return toast(ex.errors?.[0] || ex.message, { error: true }); }
        if (SHEET.id === id && sheetOpen()) again();
      } });
      return;
    }
    if ('unbook' in ds) { update((d) => { d.items.find((y) => y.id === id).bookedFor = null; }); return again(); }
    if ('alsoSubs' in ds) { update((d) => { for (const k of d.items) if (k.parentId === id && !k.completedAt) k.completedAt = i.completedAt; }); return again(); }
    if ('edit' in ds) return openEditor(id);
    if ('addSub' in ds) return again({ addSub: true });
    if ('addNote' in ds) return again({ addNote: true });
    if ('subfull' in ds) return openEditor(null, { parentId: id, title: $('#sheet [data-subadd] input')?.value.trim() || '' });
    if (ds.subtick) {
      const k = getItem(S, ds.subtick);
      update((d) => { const x = d.items.find((y) => y.id === k.id); x.completedAt = x.completedAt ? null : defaultDoneDate(k); });
      return again();
    }
    if (ds.hist) return openHistoryEntry(id, ds.hist);
    if (ds.mv) {
      const [kid, dir] = ds.mv.split('|');
      update((d) => {
        const list = d.items.filter((x) => x.parentId === id).sort((p, q) => p.order - q.order);
        const a = list.findIndex((x) => x.id === kid), z = a + Number(dir);
        if (z < 0 || z >= list.length) return;
        [list[a], list[z]] = [list[z], list[a]];
        list.forEach((x, n) => (x.order = n));
      });
      return again();
    }
    if (ds.m === 'dup') {
      const copy = baseItem({ ...clone(i), id: uid(), title: `${i.title} (copy)`.slice(0, LIMITS.title), completedAt: null, history: [], createdAt: new Date().toISOString() });
      const subCopies = kids.map((k) => baseItem({ ...clone(k), id: uid(), parentId: copy.id, completedAt: null }));
      update((d) => { d.items.push(copy, ...subCopies); });
      toast('Duplicated'); return openDetail(copy.id);
    }
    if (ds.m === 'undolast') { update((d) => undoRepeat(d.items.find((x) => x.id === id))); toast('Last done undone'); return again({ menu: false }); }
    if (ds.m === 'del') {
      if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = 'Click again to delete'; return; }
      let keepSubs = false;
      if (kids.length) {
        const c = await choiceSheet(`Delete “${i.title}”?`, `It has ${kids.length} sub-item${kids.length > 1 ? 's' : ''}. Keep them as separate items (undated ones get the parent’s dates), or delete them too.`,
          [['cancel', 'Cancel', ''], ['keep', 'Keep sub-items', ''], ['all', 'Delete all', 'danger solid']]);
        if (c === 'cancel') return again({ menu: false });
        keepSubs = c === 'keep';
      }
      const snapshot = clone(S.items);
      update((d) => {
        const kidIds = d.items.filter((x) => x.parentId === id).map((x) => x.id);
        d.items = d.items.filter((x) => x.id !== id && (keepSubs || !kidIds.includes(x.id)));
        for (const x of d.items) {
          if (x.parentId === id) {
            x.parentId = null; x.projectId = i.projectId;
            if (!x.due) { x.due = i.due; if (!x.notBefore) x.notBefore = i.notBefore; }
          }
          x.dependsOn = x.dependsOn.filter((y) => d.items.some((z) => z.id === y));
        }
      });
      closeSheet();
      toast(`Deleted “${i.title}”`, { action: 'Undo', timeout: 7000, onAction: () => { try { update((d) => { d.items = snapshot; }); } catch { toast('Undo not possible anymore', { error: true }); } } });
    }
  };
}

/* ---- edit / delete one history entry */
function openHistoryEntry(id, hid) {
  const i = getItem(S, id), hh = i?.history.find((x) => x.id === hid); if (!hh) return;
  const sh = openSheet(`<div class="kind">History entry</div><h2>${esc(i.title)}</h2>
    <form data-hf novalidate>
      <label class="field"><span>Done on</span><input type="date" name="d" value="${esc(hh.completedAt)}" max="${fromDay(TODAY)}" required></label>
      <label class="field"><span>Note</span><textarea name="n" rows="3" maxlength="${LIMITS.note}">${esc(hh.note)}</textarea></label>
      <p class="err" data-err></p>
      <div class="acts"><button type="button" class="btn danger" data-hdel>Delete entry</button><span class="sp"></span><button type="button" class="btn" data-cancel>Cancel</button><button class="btn primary">Save</button></div>
    </form>`, 'History entry', { focus: false });
  const f = $('[data-hf]', sh);
  sh.onclick = (e) => {
    if (e.target.closest('[data-cancel]')) return openDetail(id);
    const del = e.target.closest('[data-hdel]');
    if (del) {
      if (!del.dataset.sure) { del.dataset.sure = 1; del.textContent = 'Click again to delete'; return; }
      update((d) => { const x = d.items.find((y) => y.id === id); x.history = x.history.filter((y) => y.id !== hid); });
      openDetail(id);
    }
  };
  sh.onsubmit = (e) => {
    e.preventDefault();
    const v = f.elements.d.value;
    if (!isISO(v) || toDay(v) > TODAY) { $('[data-err]', sh).textContent = 'Pick a date that isn’t in the future.'; return; }
    update((d) => { const x = d.items.find((y) => y.id === id).history.find((y) => y.id === hid); x.completedAt = v; x.note = f.elements.n.value.trim(); });
    openDetail(id);
  };
}

/* =====================================================================
   5d EDITOR
   ===================================================================== */
function openEditor(id = null, preset = {}) {
  const src = id ? getItem(S, id) : null;
  const dr = src ? clone(src) : baseItem({ due: null, projectId: UI.project && UI.project !== 'none' ? UI.project : null, ...preset });
  if (dr.parentId) dr.projectId = null;
  const hasKids = !!src && kidsOf(S, src).length > 0;
  const P = parts(TODAY);
  const DUE_CHIPS = [['+1 week', TODAY + 7], ['+2 weeks', TODAY + 14], ['End of month', ymd(P.y, P.m + 1, 0)], ['End of quarter', ymd(P.y, Math.floor(P.m / 3) * 3 + 3, 0)], ['End of year', ymd(P.y, 12, 0)]];
  const NB_CHIPS = [['Today', TODAY], ['Start of next month', ymd(P.y, P.m + 1, 1)]];
  const open = { when: false, org: false, det: false };
  let query = '', dueErr = false, customDue = false, customNb = false, dueLabel = null, nbLabel = null;
  const calIcon = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="1.5" y="2.5" width="11" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M1.5 5.5H12.5M4.5 1V3.5M9.5 1V3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
  const chev = '<svg class="ed-chev" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M3 1.5L7 5L3 8.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const longDate = (n) => `${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][parts(n).wd]}, ${fmt(n, TODAY)}`;
  const isTop = () => !dr.parentId;

  const sh = openSheet(`<form data-ef novalidate class="ed">
    <div class="ed-top"><div class="kind">${src ? 'Edit item' : dr.parentId ? 'New sub-item' : 'New item'}</div><span class="sp"></span>
      <button type="button" class="btn icon ghost" data-cancel aria-label="Close">✕</button></div>
    <label class="field"><span>Title</span><input name="title" value="${esc(dr.title)}" maxlength="${LIMITS.title}" placeholder="e.g. Get flu shot" autocomplete="off" ${src ? '' : 'autofocus'}></label>
    <div class="field" data-due></div>
    <div class="ed-secs">
      <button type="button" class="ed-head" data-sec="when" aria-expanded="false">${chev}<b>When</b><span data-sum="when"></span></button>
      <div class="ed-body" data-body="when" hidden></div>
      <button type="button" class="ed-head" data-sec="org" aria-expanded="false">${chev}<b>Organize</b><span data-sum="org"></span></button>
      <div class="ed-body" data-body="org" hidden></div>
      <button type="button" class="ed-head" data-sec="det" aria-expanded="false">${chev}<b>Details</b><span data-sum="det"></span></button>
      <div class="ed-body" data-body="det" hidden>
        <div class="field" style="margin-top:0"><span>After (suggested order)</span><div class="chips" data-picked></div>
          <input class="txt ed-search" data-search placeholder="Search items…" autocomplete="off" aria-label="Search items to do this after">
          <div class="ed-results" data-results></div></div>
        <label class="field"><span>Notes</span><textarea name="notes" rows="3" maxlength="${LIMITS.notes}">${esc(dr.notes)}</textarea></label>
      </div>
    </div>
    <ul class="msgs" data-msgs></ul>
    <div class="ed-foot"><span class="muted desktop-only" style="font-size:12px">Enter ↵ saves</span><span class="sp"></span>
      <button type="button" class="btn" data-cancel>Cancel</button><button class="btn primary">Save</button></div>
  </form>`, src ? 'Edit item' : 'New item', { focus: !src });
  const f = $('[data-ef]', sh);
  const q = (sel) => $(sel, f);

  /* ---------- due */
  function renderDue() {
    const due = dr.due ? toDay(dr.due) : null;
    // several chips can fall on the same day (end of quarter = end of year in Q4): highlight the one clicked
    const hit = DUE_CHIPS.find(([l, d]) => d === due && l === dueLabel) || DUE_CHIPS.find(([, d]) => d === due);
    const custom = due != null && !hit;
    let h = `<span>Due</span><div class="chips dchips">`;
    if (dr.parentId) h += `<button type="button" class="chip dchip${due == null ? ' on' : ''}" data-due-inherit aria-pressed="${due == null}">Parent’s window</button>`;
    h += DUE_CHIPS.map(([l, d]) => { const on = hit && hit[0] === l; return `<button type="button" class="chip dchip${on ? ' on' : ''}" data-due-day="${d}" data-label="${l}" title="${esc(longDate(d))}" aria-pressed="${!!on}">${l}</button>`; }).join('');
    h += custom || customDue
      ? `<input type="date" class="chip dchip dinput${custom ? ' on' : ''}" data-due-input value="${esc(dr.due || '')}" aria-label="Due date">`
      : `<button type="button" class="chip dchip dpick" data-due-pick>${calIcon}Pick date</button>`;
    h += '</div>';
    if (due != null) h += `<div class="ed-line">by <b>${longDate(due)}</b> · ${rel(due, TODAY)}</div>`;
    else if (dr.parentId) h += '<div class="ed-line">inherits the parent’s window</div>';
    else h += `<div class="ed-line${dueErr ? ' err-line' : ''}">${dueErr ? 'Pick a due date' : 'Pick a due date — every item has one'}</div>`;
    q('[data-due]').innerHTML = h;
  }

  /* ---------- when */
  const nbISO = () => dr.notBefore || defaultNB(dr); // shown start: explicit, else the default (creation day ≤ due)
  function renderWhen() {
    const nbS = nbISO(), nb = nbS ? toDay(nbS) : null;
    const hit = NB_CHIPS.find(([l, d]) => d === nb && l === nbLabel) || NB_CHIPS.find(([, d]) => d === nb);
    let h = `<div class="field" style="margin-top:0"><span>Not before</span><div class="chips">`
      + NB_CHIPS.map(([l, d]) => { const on = hit && hit[0] === l; return `<button type="button" class="chip dchip${on ? ' on' : ''}" data-nb-day="${d}" data-label="${l}" title="${esc(longDate(d))}" aria-pressed="${!!on}">${l}</button>`; }).join('')
      + ((nb != null && !hit) || customNb
        ? `<input type="date" class="chip dchip dinput${nb != null && !hit ? ' on' : ''}" data-nb-input value="${esc(nbS || '')}" aria-label="Not before">`
        : `<button type="button" class="chip dchip dpick" data-nb-pick>${calIcon}Pick date</button>`)
      + (dr.parentId && !dr.due && dr.notBefore ? '<button type="button" class="btn small ghost" data-nb-clear>Clear</button>' : '') + '</div>'
      + (!dr.notBefore && nb != null ? `<div class="ed-line">default: ${nb < TODAY ? 'the due date' : 'today'}</div>` : '') + '</div>';
    h += `<div class="row2" style="grid-template-columns:1fr 1fr">
      <label class="field"><span>Scheduled for</span><span class="dwrap"><input type="date" name="bookedFor" value="${esc(dr.bookedFor || '')}">${dr.bookedFor ? '<button type="button" class="btn small ghost" data-clear-booked aria-label="Unschedule">✕</button>' : ''}</span></label>
      ${isTop() ? `<label class="field"><span>Repeat after done</span><span class="dwrap"><select name="repeatMonths"><option value="">No repeat</option>${[1, 2, 3, 4, 6, 12, 24].concat(dr.repeatMonths && ![1, 2, 3, 4, 6, 12, 24].includes(dr.repeatMonths) ? [dr.repeatMonths] : []).map((m) => `<option value="${m}" ${dr.repeatMonths === m ? 'selected' : ''}>every ${m} mo</option>`).join('')}</select>
        ${dr.repeatMonths ? `<select name="repeatFrom" aria-label="Counted from"><option value="done" ${dr.repeatFrom !== 'due' ? 'selected' : ''}>from done</option><option value="due" ${dr.repeatFrom === 'due' ? 'selected' : ''}>from due</option></select>` : ''}</span></label>` : '<span></span>'}
    </div>`;
    const pv = previewText();
    if (pv) h += `<div class="preview">${esc(pv)}</div>`;
    q('[data-body="when"]').innerHTML = h;
  }
  function previewText() {
    if (!nbISO() && !dr.bookedFor && !dr.repeatMonths) return '';
    const d2 = { ...dr, notBefore: nbISO() };
    const tmp = { ...S, items: [...S.items.filter((x) => x.id !== dr.id), d2] };
    idx(tmp, true);
    const du = effDue(tmp, d2), nb = effNB(tmp, d2);
    if (du == null) return '';
    let pv = nb != null ? `Window · ${fmt(nb, TODAY)} – ${fmt(du, TODAY)} (${du - nb + 1} days)` : `Deadline · by ${fmt(du, TODAY)}`;
    if (dr.bookedFor && isISO(dr.bookedFor)) pv += ` · scheduled ${fmt(toDay(dr.bookedFor), TODAY)}`;
    if (dr.repeatMonths) pv += ` · ↻ every ${dr.repeatMonths} mo from ${dr.repeatFrom === 'due' ? 'due' : 'done'} date`;
    return pv;
  }

  /* ---------- organize */
  function renderOrg() {
    const par = dr.parentId ? getItem(S, dr.parentId) : null;
    let h = '';
    if (par) h += `<div class="field" style="margin-top:0"><span>Project</span><div class="muted">Sub-item of <b>${esc(par.title)}</b> (uses its project)</div></div>`;
    else {
      h += `<div class="field" style="margin-top:0"><span>Project</span><div class="chips" data-projs>${S.projects.filter((p) => !p.archived || p.id === dr.projectId).map((p) =>
        `<button type="button" class="chip proj${dr.projectId === p.id ? ' on' : ''}" data-proj="${esc(p.id)}" aria-pressed="${dr.projectId === p.id}" style="--c:${p.color}">${esc(p.name)}</button>`).join('')}
        <button type="button" class="chip newtag" data-newproj style="--c:transparent">+ New project</button></div></div>`;
    }
    h += `<div class="field"><span>Tags</span><div class="chips" data-tagbox>${S.tags.map((g) =>
      `<button type="button" class="chip${dr.tagIds.includes(g.id) ? ' on' : ''}" data-tag="${esc(g.id)}" aria-pressed="${dr.tagIds.includes(g.id)}" style="--c:${g.color}">${esc(g.name)}</button>`).join('')}
      <button type="button" class="chip newtag" data-newtag style="--c:transparent">+ New tag</button></div></div>`;
    if (src && !hasKids) {
      const parents = S.items.filter((x) => !x.parentId && x.id !== dr.id).sort((a, b) => a.title.localeCompare(b.title));
      h += `<label class="field"><span>Sub-item of</span><select name="parentId"><option value="">— none (top-level) —</option>${parents.map((p) => `<option value="${esc(p.id)}" ${dr.parentId === p.id ? 'selected' : ''}>${esc(p.title)}</option>`).join('')}</select></label>`;
    }
    q('[data-body="org"]').innerHTML = h;
  }

  /* ---------- details: after (search) */
  function renderPicked() {
    q('[data-picked]').innerHTML = dr.dependsOn.map((d) => getItem(S, d)).filter(Boolean).map((o) =>
      `<span class="pick">${esc(o.title)}<button type="button" data-unpick="${esc(o.id)}" aria-label="Remove ${esc(o.title)}">×</button></span>`).join('');
  }
  function renderResults() {
    const proj = dr.parentId ? topOf(S, getItem(S, dr.parentId) || dr).projectId : dr.projectId;
    const ql = query.trim().toLowerCase();
    const cand = S.items.filter((o) => o.id !== dr.id && !dr.dependsOn.includes(o.id) && (!ql || o.title.toLowerCase().includes(ql)))
      .sort((a, b) => b.createdAt.localeCompare(a.createdAt));
    const projOf = (o) => topOf(S, o).projectId;
    const mine = proj ? cand.filter((o) => projOf(o) === proj) : [];
    const rest = cand.filter((o) => !mine.includes(o));
    const hl = (t) => { if (!ql) return esc(t); const k = t.toLowerCase().indexOf(ql); return k < 0 ? esc(t) : `${esc(t.slice(0, k))}<mark>${esc(t.slice(k, k + ql.length))}</mark>${esc(t.slice(k + ql.length))}`; };
    const row = (o) => { const par = parentOf(S, o); return `<button type="button" class="ed-res" data-pick="${esc(o.id)}"><span class="plus">+</span>${par ? `<span class="muted">${esc(par.title)} › </span>` : ''}${hl(o.title)}</button>`; };
    let h = '', left = 8;
    const block = (title, list) => { const l = list.slice(0, left); left -= l.length; return l.length ? `<div class="ed-grp">${esc(title)}</div>${l.map(row).join('')}` : ''; };
    const pName = S.projects.find((p) => p.id === proj)?.name;
    h += block(pName || 'This project', mine) + block(mine.length ? 'Other' : 'Items', rest);
    q('[data-results]').innerHTML = h || `<div class="muted" style="padding:8px 10px;font-size:13px">${ql ? 'No match.' : 'No other items.'}</div>`;
  }

  /* ---------- summaries, messages */
  function renderSums() {
    const w = [];
    if (nbISO() && isISO(nbISO())) w.push(`starts ${fmt(toDay(nbISO()), TODAY)}`);
    if (dr.bookedFor && isISO(dr.bookedFor)) w.push(`scheduled ${fmt(toDay(dr.bookedFor), TODAY)}`);
    if (dr.repeatMonths) w.push(`↻ ${dr.repeatMonths} mo`);
    q('[data-sum="when"]').innerHTML = w.length ? esc(w.join(' · ')) : '<i>start, schedule, repeat</i>';
    const p = S.projects.find((x) => x.id === dr.projectId);
    const tags = dr.tagIds.map((t) => S.tags.find((g) => g.id === t)?.name).filter(Boolean);
    const par = dr.parentId ? getItem(S, dr.parentId) : null;
    const o = [];
    if (par) o.push(`in ${esc(par.title)}`);
    else if (p) o.push(`<i class="sq" style="background:${p.color}"></i>${esc(p.name)}`);
    if (tags.length) o.push(tags.map((t) => `#${esc(t)}`).join(' '));
    q('[data-sum="org"]').innerHTML = o.length ? o.join(' · ') : '<i>project, tags</i>';
    const deps = dr.dependsOn.map((d) => getItem(S, d)).filter(Boolean);
    const d = [];
    if (deps.length) d.push(`after ${esc(deps[0].title)}${deps.length > 1 ? ` +${deps.length - 1}` : ''}`);
    if (dr.notes.trim()) d.push('notes');
    q('[data-sum="det"]').innerHTML = d.length ? d.join(' · ') : '<i>order, notes</i>';
  }
  function renderMsgs(extra = []) {
    const r = validateItem(S, { ...dr, title: dr.title || ' ', due: dr.due || (isTop() ? '2000-01-01' : null) }, TODAY);
    const errs = r.errors.filter((e) => !/Title|Due date is required/.test(e));
    q('[data-msgs]').innerHTML = [...extra.map((e) => `<li class="e">${esc(e)}</li>`), ...errs.map((e) => `<li class="e">${esc(e)}</li>`), ...r.warnings.map((w) => `<li class="w">⚠ ${esc(w)}</li>`)].join('');
  }
  const refresh = () => { renderSums(); renderMsgs(); };
  const setSec = (k, v) => {
    open[k] = v;
    q(`[data-sec="${k}"]`).setAttribute('aria-expanded', String(v));
    q(`[data-body="${k}"]`).hidden = !v;
  };

  renderDue(); renderWhen(); renderOrg(); renderPicked(); renderResults(); refresh();

  /* ---------- events */
  const newChipInput = (btn, label, onDone) => {
    btn.outerHTML = `<input class="txt newtag-in" data-newin placeholder="${label}" maxlength="${LIMITS.name}" aria-label="${label}" style="width:140px;min-height:30px;padding:3px 10px;border-radius:999px">`;
    const inp = $('[data-newin]', f);
    inp.focus();
    inp.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') { ev.preventDefault(); onDone(inp.value.trim()); }
      else if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); onDone(''); }
    });
    inp.addEventListener('blur', () => { if (inp.isConnected) onDone(inp.value.trim()); });
  };
  const createNamed = (kind, name) => {
    if (!name) return null;
    const list = kind === 'project' ? S.projects : S.tags;
    const ex = list.find((x) => x.name.toLowerCase() === name.toLowerCase());
    if (ex) return ex.id;
    const nid = uid();
    try {
      update((d) => {
        const l = kind === 'project' ? d.projects : d.tags;
        l.push({ id: nid, name: name.slice(0, LIMITS.name), color: PALETTE[l.length % PALETTE.length], ...(kind === 'project' ? { archived: false, order: l.length } : {}) });
      });
    } catch (ex2) { toast(ex2.errors?.[0] || ex2.message, { error: true }); return null; }
    return nid;
  };

  sh.onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const ds = b.dataset;
    if ('cancel' in ds) { if (src) openDetail(src.id); else closeSheet(); return; }
    if (ds.sec) { setSec(ds.sec, !open[ds.sec]); return; }
    if (ds.dueDay) { dr.due = fromDay(+ds.dueDay); dueLabel = ds.label; dueErr = false; customDue = false; renderDue(); renderWhen(); refresh(); return; }
    if ('dueInherit' in ds) { dr.due = null; customDue = false; renderDue(); renderWhen(); refresh(); return; }
    if ('duePick' in ds) { customDue = true; renderDue(); const i = q('[data-due-input]'); i.focus(); try { i.showPicker(); } catch { /* not supported */ } return; }
    if (ds.nbDay) { dr.notBefore = fromDay(+ds.nbDay); nbLabel = ds.label; customNb = false; renderWhen(); refresh(); return; }
    if ('nbPick' in ds) { customNb = true; renderWhen(); const i = q('[data-nb-input]'); i.focus(); try { i.showPicker(); } catch { /* not supported */ } return; }
    if ('nbClear' in ds) { dr.notBefore = null; customNb = false; renderWhen(); refresh(); return; }
    if ('clearBooked' in ds) { dr.bookedFor = null; renderWhen(); refresh(); return; }
    if (ds.proj) { dr.projectId = dr.projectId === ds.proj ? null : ds.proj; renderOrg(); renderResults(); refresh(); return; }
    if ('newproj' in ds) { newChipInput(b, 'Project name', (n) => { const pid = createNamed('project', n); if (pid) dr.projectId = pid; renderOrg(); renderResults(); refresh(); }); return; }
    if (ds.tag) { const g = ds.tag; dr.tagIds = dr.tagIds.includes(g) ? dr.tagIds.filter((x) => x !== g) : [...dr.tagIds, g]; renderOrg(); refresh(); return; }
    if ('newtag' in ds) { newChipInput(b, 'Tag name', (n) => { const tid = createNamed('tag', n); if (tid && !dr.tagIds.includes(tid)) dr.tagIds.push(tid); renderOrg(); refresh(); }); return; }
    if (ds.pick) { dr.dependsOn.push(ds.pick); renderPicked(); renderResults(); refresh(); return; }
    if (ds.unpick) { dr.dependsOn = dr.dependsOn.filter((x) => x !== ds.unpick); renderPicked(); renderResults(); refresh(); }
  };
  const onField = (e) => {
    const t = e.target;
    if (t.name === 'title') dr.title = t.value;
    else if (t.name === 'notes') dr.notes = t.value;
    else if (t.matches('[data-search]')) { query = t.value; renderResults(); return; }
    else if (t.matches('[data-due-input]')) { dr.due = t.value || null; dueErr = false; if (e.type === 'change') { renderDue(); renderWhen(); } }
    else if (t.matches('[data-nb-input]')) { dr.notBefore = t.value || null; if (e.type === 'change') renderWhen(); }
    else if (t.name === 'bookedFor') { dr.bookedFor = t.value || null; if (e.type === 'change') renderWhen(); }
    else if (t.name === 'repeatMonths') { dr.repeatMonths = t.value ? Number(t.value) : null; renderWhen(); }
    else if (t.name === 'repeatFrom') { dr.repeatFrom = t.value === 'due' ? 'due' : 'done'; renderWhen(); }
    else if (t.name === 'parentId') { dr.parentId = t.value || null; if (dr.parentId) { dr.projectId = null; dr.repeatMonths = null; } renderDue(); renderWhen(); renderOrg(); renderResults(); }
    else return;
    refresh();
  };
  sh.oninput = onField;
  sh.onchange = onField;
  sh.onkeydown = (e) => { if (e.key === 'Enter' && e.target.matches('[data-search]')) { e.preventDefault(); const first = q('[data-pick]'); if (first) first.click(); } };
  sh.onsubmit = (e) => {
    e.preventDefault();
    dr.title = dr.title.trim();
    if (!dr.title) { renderMsgs(['Title is required.']); q('[name=title]').focus(); return; }
    if (isTop() && !dr.due) { dueErr = true; renderDue(); q('.dchip').focus(); return; }
    if (!isTop()) { dr.projectId = null; dr.repeatMonths = null; }
    const r = validateItem(S, dr, TODAY);
    if (r.errors.length) {
      renderMsgs(r.errors);
      if (r.errors.some((x) => /window|before|Repeat|Scheduled/.test(x))) setSec('when', true);
      if (r.errors.some((x) => /cycle|depend/.test(x))) setSec('det', true);
      return;
    }
    if (dr.parentId && !src?.parentId) dr.order = kidsOf(S, getItem(S, dr.parentId)).length;
    try { update((d) => { const k = d.items.findIndex((x) => x.id === dr.id); if (k >= 0) d.items[k] = dr; else d.items.push(dr); }); }
    catch (ex) { renderMsgs(ex.errors || [ex.message]); return; }
    if (dr.parentId && !src && !expanded(dr.parentId)) { UI.expanded.push(dr.parentId); saveUI(); renderTimeline(); }
    if (src) openDetail(dr.id); else closeSheet();   // §20: no sheet after creating
  };
}

/* =====================================================================
   5e SETTINGS
   ===================================================================== */
function openSettings() {
  const s = S, st = s.settings;
  const cnt = (fn) => s.items.filter(fn).length;
  const row = (kind, x, k, n) => `<div class="mrow" data-${kind}="${esc(x.id)}">
    <input type="color" class="swatch" list="palette" value="${esc(x.color)}" data-field="color" aria-label="Color">
    <input class="txt" value="${esc(x.name)}" data-field="name" maxlength="${LIMITS.name}" aria-label="Name">
    <span class="muted" style="font-size:12px">${kind === 'project' ? cnt((i) => i.projectId === x.id) : cnt((i) => i.tagIds.includes(x.id))}</span>
    ${kind === 'project' ? `<button class="btn small icon" data-pmv="-1" ${k === 0 ? 'disabled' : ''} aria-label="Up">↑</button><button class="btn small icon" data-pmv="1" ${k === n - 1 ? 'disabled' : ''} aria-label="Down">↓</button>
    <label class="ck"><input type="checkbox" data-field="archived" ${x.archived ? 'checked' : ''}> archived</label>` : ''}
    <button class="btn small danger" data-rm>Delete</button></div>`;
  const opt = (v, cur, l) => `<option value="${v}" ${String(v) === String(cur) ? 'selected' : ''}>${l}</option>`;
  const sh = openSheet(`<div class="kind">Settings</div><h2>Settings</h2>
    <datalist id="palette">${PALETTE.map((c) => `<option value="${c}"></option>`).join('')}</datalist>
    <h3>Projects</h3>${s.projects.map((p, k) => row('project', p, k, s.projects.length)).join('')}
    <form class="mrow" data-add="project"><input class="txt" name="n" placeholder="New project" maxlength="${LIMITS.name}"><button class="btn small">Add</button></form>
    <h3>Tags</h3>${s.tags.map((g, k) => row('tag', g, k, s.tags.length)).join('')}
    <form class="mrow" data-add="tag"><input class="txt" name="n" placeholder="New tag" maxlength="${LIMITS.name}"><button class="btn small">Add</button></form>
    <h3>Preferences</h3><div class="prefs">
      <label for="pT">Theme</label><select class="sel" id="pT" data-pref="theme">${opt('system', st.theme, 'System')}${opt('light', st.theme, 'Light')}${opt('dark', st.theme, 'Dark')}</select>
      <label for="pW">Week starts</label><select class="sel" id="pW" data-pref="weekStart">${opt(1, st.weekStart, 'Monday')}${opt(0, st.weekStart, 'Sunday')}</select>
      <label for="pS">“Soon” window</label><span><input class="txt" type="number" id="pS" min="0" max="365" value="${st.dueSoonDays}" data-pref="dueSoonDays" style="width:80px"> days</span>
    </div>
    <h3>Data</h3><p class="muted" style="margin-top:0">Stored only in this browser (localStorage). Import accepts v1 and v2 exports.</p>
    <div class="acts" style="margin-top:6px"><button class="btn primary" data-x="export">Export JSON</button><button class="btn" data-x="import">Import…</button><span class="sp"></span>
      <button class="btn" data-x="demo">Load demo</button><button class="btn danger" data-x="wipe">Delete all</button></div>
    <p class="muted" style="font-size:12px">Timeline Planner ${VERSION} · add <code>#lab</code> to the URL for the style lab.</p>
    <div class="acts"><span class="sp"></span><button class="btn primary" data-close>Close</button></div>`, 'Settings');
  const safe = (fn, opts) => { try { update(fn, opts); } catch (ex) { toast(ex.errors?.[0] || ex.message, { error: true }); } openSettings(); };
  sh.onchange = (e) => {
    const x = e.target, r = x.closest('[data-project],[data-tag]');
    if (r && x.dataset.field) {
      const isP = 'project' in r.dataset, rid = isP ? r.dataset.project : r.dataset.tag, fld = x.dataset.field;
      const v = fld === 'archived' ? x.checked : x.value.trim();
      return safe((d) => { (isP ? d.projects : d.tags).find((y) => y.id === rid)[fld] = v; });
    }
    if (x.dataset.pref) {
      let v = x.value; if (x.dataset.pref === 'weekStart') v = +v; if (x.dataset.pref === 'dueSoonDays') v = clamp(Math.round(+v || 0), 0, 365);
      safe((d) => { d.settings[x.dataset.pref] = v; }, { touch: false });
    }
  };
  sh.onsubmit = (e) => {
    const f = e.target.closest('[data-add]'); if (!f) return; e.preventDefault();
    const n = f.elements.n.value.trim(); if (!n) return;
    const kind = f.dataset.add;
    safe((d) => { const list = kind === 'project' ? d.projects : d.tags; list.push({ id: uid(), name: n, color: PALETTE[list.length % PALETTE.length], ...(kind === 'project' ? { archived: false, order: list.length } : {}) }); });
  };
  sh.onclick = async (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const r = b.closest('[data-project],[data-tag]');
    if (r && b.dataset.pmv) {
      const rid = r.dataset.project;
      return safe((d) => { const a = d.projects.findIndex((p) => p.id === rid), z = a + Number(b.dataset.pmv); if (z < 0 || z >= d.projects.length) return; [d.projects[a], d.projects[z]] = [d.projects[z], d.projects[a]]; d.projects.forEach((p, k) => (p.order = k)); });
    }
    if (r && 'rm' in b.dataset) {
      const isP = 'project' in r.dataset, rid = isP ? r.dataset.project : r.dataset.tag;
      if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'Sure?'; return; }
      return safe((d) => { if (isP) { d.projects = d.projects.filter((p) => p.id !== rid); d.items.forEach((i) => { if (i.projectId === rid) i.projectId = null; }); } else { d.tags = d.tags.filter((g) => g.id !== rid); d.items.forEach((i) => { i.tagIds = i.tagIds.filter((g) => g !== rid); }); } });
    }
    if ('close' in b.dataset) return closeSheet();
    const x = b.dataset.x;
    if (x === 'export') exportJSON();
    else if (x === 'import') pickImport();
    else if (x === 'demo') { if (!S.items.length || await confirmSheet('Load demo data?', 'Everything in this browser is replaced.', 'Replace', true)) { replaceAll(demoState()); toast('Demo loaded'); closeSheet(); } else openSettings(); }
    else if (x === 'wipe') { if (await confirmSheet('Delete all data?', 'Items, projects, tags and settings are removed from this browser.', 'Delete all', true)) { replaceAll(emptyState()); closeSheet(); toast('All data deleted'); } else openSettings(); }
  };
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `timeline-planner-${fromDay(TODAY)}.json`;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast('Exported');
}
function pickImport() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = async () => { const file = inp.files?.[0]; if (file) importText(await file.text(), file.name); };
  inp.click();
}
async function importText(text, name = 'file') {
  let doc;
  try { doc = migrate(JSON.parse(text)); const errs = validateState(doc, TODAY); if (errs.length) throw new VErr(errs); }
  catch (ex) {
    const list = ex.errors || [ex instanceof SyntaxError ? 'Not valid JSON.' : ex.message];
    openSheet(`<h2>Import failed</h2><p class="muted">${esc(name)}:</p><ul class="msgs">${list.slice(0, 8).map((x) => `<li class="e">${esc(x)}</li>`).join('')}</ul><div class="acts"><span class="sp"></span><button class="btn primary" data-close>OK</button></div>`, 'Import failed');
    $('#sheet').onclick = (e) => { if (e.target.closest('[data-close]')) closeSheet(); };
    return;
  }
  const subs = doc.items.filter((i) => i.parentId).length;
  if (await confirmSheet('Replace all data?', `${name}: ${doc.items.length - subs} items, ${subs} sub-items, ${doc.projects.length} projects, ${doc.tags.length} tags. Everything in this browser will be replaced.`, 'Replace all', true)) {
    replaceAll(doc); toast('Imported');
  }
}

/* =====================================================================
   5f FILTERS, BANNER, LAB, RENDER ALL
   ===================================================================== */
/** multi-select tag filter as a dropdown (works with many tags, same look as the project select) */
let TAGDD_OPEN = false;
function tagDropdownHTML(s) {
  const sel = s.tags.filter((g) => UI.tags.includes(g.id));
  const label = !sel.length ? 'All tags' : sel.length <= 2 ? sel.map((g) => g.name).join(', ') : `${sel.length} tags`;
  return `<div class="dd" data-tagdd><button type="button" class="sel dd-btn${sel.length ? ' on' : ''}" data-tagbtn aria-haspopup="true" aria-expanded="${TAGDD_OPEN}">${esc(label)}</button>
    ${TAGDD_OPEN ? `<div class="dd-menu" role="group" aria-label="Filter by tag">${s.tags.map((g) =>
      `<label class="dd-item"><input type="checkbox" data-ftag-cb="${esc(g.id)}" ${UI.tags.includes(g.id) ? 'checked' : ''}><i style="background:${g.color}"></i>${esc(g.name)}</label>`).join('')}
      ${sel.length ? '<button type="button" class="linkbtn dd-clear" data-tagclear>Clear</button>' : ''}</div>` : ''}</div>`;
}
function renderFilters() {
  const s = S;
  if (UI.project && UI.project !== 'none' && !s.projects.some((p) => p.id === UI.project)) UI.project = '';
  UI.tags = UI.tags.filter((t) => s.tags.some((g) => g.id === t));
  const html = `<select class="sel" data-f="project" aria-label="Project filter"><option value="">All projects</option>
      ${s.projects.filter((p) => !p.archived || UI.showArchived).map((p) => `<option value="${esc(p.id)}" ${UI.project === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
      <option value="none" ${UI.project === 'none' ? 'selected' : ''}>No project</option></select>
    ${s.tags.length ? tagDropdownHTML(s) : ''}
    <select class="sel" data-f="sort" aria-label="Sort timeline rows" title="Sort timeline rows">
      <option value="due" ${UI.sort === 'due' ? 'selected' : ''}>Sort: due date</option>
      <option value="next" ${UI.sort === 'next' ? 'selected' : ''}>Sort: next date</option>
      <option value="start" ${UI.sort === 'start' ? 'selected' : ''}>Sort: start date</option></select>
    <label class="ck" title="Group rows by project"><input type="checkbox" data-f="group" ${UI.group ? 'checked' : ''}> grouped</label>
    <label class="ck" title="Show done items on the timeline"><input type="checkbox" data-f="done" ${UI.showDone ? 'checked' : ''}> done</label>
    <label class="ck" title="Show dependency arrows on the timeline"><input type="checkbox" data-f="deps" ${UI.showDeps !== false ? 'checked' : ''}> arrows</label>
    ${s.projects.some((p) => p.archived) ? `<label class="ck"><input type="checkbox" data-f="archived" ${UI.showArchived ? 'checked' : ''}> archived</label>` : ''}`;
  $$('[data-filters]').forEach((el) => (el.innerHTML = html));
}
function renderBanner() {
  $('#banner').innerHTML = storageOK ? '' : '<div class="banner">⚠ This browser doesn’t allow saving (localStorage). Changes are lost on reload — use Export.</div>';
}
function renderLab() {
  const el = $('#lab');
  el.hidden = !UI.labOpen;
  if (!UI.labOpen) return;
  const sel = (k, opts) => `<select class="sel" data-lab="${k}">${opts.map(([v, l]) => `<option value="${v}" ${UI.lab[k] === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  el.innerHTML = `<h4>Style lab<span class="sp"></span><button class="btn small ghost" data-labclose aria-label="Close lab">✕</button></h4>
    <label>Sub rows ${sel('subrows', [['connector', 'connector line'], ['plain', 'indent only']])}</label>`;
}
function applyTheme() {
  const t = S.settings.theme;
  if (t === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
}
function applyLayout() {
  $('#main').classList.toggle('side-collapsed', !!UI.sideCollapsed);
  const tab = UI.tab || (isPhone() ? 'up' : 'timeline');
  document.body.dataset.tab = tab;
  $$('.tabs [data-tab]').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
}
function renderAll() {
  applyTheme(); applyLayout(); renderFilters(); renderBanner(); renderLab();
  renderUpcoming(); renderTimeline();
}

/* =====================================================================
   6 EVENTS
   ===================================================================== */
function setTab(t) {
  UI.tab = t; saveUI(); applyLayout();
  if (t === 'timeline') requestAnimationFrame(() => { renderTimeline(); if (!R.scrolled) scrollToToday(); });
}
function goToday() {
  if (isPhone() && document.body.dataset.tab !== 'timeline') { setTab('timeline'); requestAnimationFrame(() => requestAnimationFrame(scrollToToday)); }
  else scrollToToday();
}
function openMore() {
  const sh = openSheet(`<div class="kind">View</div><h2>Filters &amp; zoom</h2>
    <div class="field"><span>Zoom</span><div class="seg wide"><button data-zoom="day">Day</button><button data-zoom="week">Week</button><button data-zoom="month">Month</button><button data-zoom="year">Year</button></div></div>
    <div class="field"><span>Filter</span><div class="filters" data-filters></div></div>
    <div class="acts"><span class="sp"></span><button class="btn primary" data-close>Done</button></div>`, 'Filters and zoom');
  sh.onclick = (e) => { if (e.target.closest('[data-close]')) closeSheet(); };
  renderFilters(); renderTimeline();
}

function bind() {
  // global clicks
  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-act]');
    if (a) {
      const act = a.dataset.act;
      if (act === 'new') openEditor();
      else if (act === 'today') goToday();
      else if (act === 'side') { UI.sideCollapsed = !UI.sideCollapsed; saveUI(); applyLayout(); requestAnimationFrame(renderTimeline); }
      else if (act === 'more') openMore();
      else if (act === 'settings') openSettings();
      return;
    }
    const z = e.target.closest('[data-zoom]');
    if (z) { setZoom(ZOOMS[z.dataset.zoom]); return; }
    const tb = e.target.closest('.tabs [data-tab]');
    if (tb) { setTab(tb.dataset.tab); return; }
    if (e.target.closest('[data-tagbtn]')) { TAGDD_OPEN = !TAGDD_OPEN; renderFilters(); return; }
    if (e.target.closest('[data-tagclear]')) { UI.tags = []; saveUI(); renderAll(); return; }
    if (TAGDD_OPEN && !e.target.closest('[data-tagdd]')) { TAGDD_OPEN = false; renderFilters(); }
    const ft = e.target.closest('[data-ftag]');
    if (ft) { const t = ft.dataset.ftag; UI.tags = UI.tags.includes(t) ? UI.tags.filter((x) => x !== t) : [...UI.tags, t]; saveUI(); renderAll(); return; }
    if (e.target.closest('[data-labclose]')) { UI.labOpen = false; saveUI(); renderLab(); if (location.hash === '#lab') history.replaceState(null, '', location.pathname + location.search); }
  });
  document.addEventListener('change', (e) => {
    const f = e.target.closest('[data-f]');
    if (f) {
      const k = f.dataset.f;
      if (k === 'project') UI.project = f.value; else if (k === 'done') UI.showDone = f.checked; else if (k === 'archived') UI.showArchived = f.checked;
      else if (k === 'sort') UI.sort = f.value; else if (k === 'group') UI.group = f.checked; else if (k === 'deps') UI.showDeps = f.checked;
      saveUI(); renderAll(); return;
    }
    const tc = e.target.closest('[data-ftag-cb]');
    if (tc) { const t = tc.dataset.ftagCb; UI.tags = tc.checked ? [...new Set([...UI.tags, t])] : UI.tags.filter((x) => x !== t); saveUI(); renderAll(); return; }
    const l = e.target.closest('[data-lab]');
    if (l) { UI.lab[l.dataset.lab] = l.value; saveUI(); renderTimeline(); }
  });
  // sheet overlay
  $('#ov').addEventListener('mousedown', (e) => { if (e.target.id === 'ov') closeSheet(); });
  $('#ov').addEventListener('click', (e) => { if (e.target.closest('[data-close]') && !e.target.closest('[data-c],[data-ok]')) closeSheet(); });
  document.addEventListener('keydown', (e) => {
    if (sheetOpen()) {
      if (e.key === 'Escape') { e.preventDefault(); if (TAGDD_OPEN) { TAGDD_OPEN = false; renderFilters(); } else closeSheet(); return; }
      if (e.key === 'Tab') {
        const f = $$('button:not([disabled]), input, select, textarea, [tabindex="0"]', $('#sheet')).filter((x) => x.offsetParent);
        if (!f.length) return;
        if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
      }
      return;
    }
    if (e.key === 'Escape' && TAGDD_OPEN) { TAGDD_OPEN = false; renderFilters(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey || e.target.closest('input, select, textarea')) return;
    const k = e.key.toLowerCase();
    if (k === 'n') { e.preventDefault(); openEditor(); }
    else if (k === 't') { e.preventDefault(); goToday(); }
    else if ('1234'.includes(k) && k) setZoom(Object.values(ZOOMS)[+k - 1]);
  });
  // side list
  $('#side').addEventListener('toggle', (e) => {
    if (e.target.matches('[data-legend]')) { UI.legendOpen = e.target.open; saveUI(); }
  }, true);
  $('#side').addEventListener('click', (e) => {
    const t = e.target.closest('[data-tick]');
    if (t) { tickItem(t.dataset.tick); return; }
    const r = e.target.closest('[data-id]');
    if (r) openDetail(r.dataset.id);
  });
  // timeline
  const cw = chart();
  cw.addEventListener('scroll', () => {
    syncScroll();
    cancelAnimationFrame(R.raf);
    R.raf = requestAnimationFrame(() => { if (needsFg()) renderFg(); if (needsBg()) renderBg(); else renderAxis(); });
  }, { passive: true });
  $('#labelsWrap').addEventListener('scroll', () => { if (cw.scrollTop !== $('#labelsWrap').scrollTop) cw.scrollTop = $('#labelsWrap').scrollTop; }, { passive: true });
  const openFrom = (e) => {
    const q = e.target.closest('[data-sched]');
    if (q && e.type === 'click') { e.stopPropagation(); quickSchedule(q.dataset.sched, +q.dataset.day, e.clientX, e.clientY); return; }
    const x = e.target.closest('[data-exp]');
    if (x) { e.stopPropagation(); const id = x.dataset.exp; UI.expanded = expanded(id) ? UI.expanded.filter((y) => y !== id) : [...UI.expanded, id]; saveUI(); renderTimeline(); return; }
    const g = e.target.closest('[data-id]'); if (g) openDetail(g.dataset.id);
  };
  for (const el of [cw, $('#labels')]) {
    el.addEventListener('click', openFrom);
    el.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('[data-id]') && !e.target.closest('[data-exp]')) { e.preventDefault(); openFrom(e); } });
  }
  // create on the timeline: double-click (desktop) / long-press (touch) on empty space → due = that day, project = row's project
  const addAt = (clientX, clientY) => {
    const svg = $('svg', cw); if (!svg) return;
    const r = svg.getBoundingClientRect();
    const day = Math.floor(R.mn + (clientX - r.left) / R.ppd), y = clientY - r.top;
    const row = R.rows.find((rw) => y >= rw.y && y < rw.y + rw.h);
    let projectId = UI.project && UI.project !== 'none' ? UI.project : null;
    if (row) projectId = row.type === 'g' ? (row.p ? row.p.id : null) : (topOf(S, row.it).projectId || null);
    if (projectId && !S.projects.some((p) => p.id === projectId)) projectId = null;
    openEditor(null, { due: fromDay(day), projectId });
  };
  cw.addEventListener('dblclick', (e) => { if (!e.target.closest('[data-id]')) addAt(e.clientX, e.clientY); });
  let lp = null;
  cw.addEventListener('touchstart', (e) => {
    clearTimeout(lp?.t); lp = null;
    if (e.touches.length !== 1 || e.target.closest('[data-id]')) return;
    const t0 = e.touches[0];
    lp = { x: t0.clientX, y: t0.clientY, t: setTimeout(() => { if (lp) { addAt(lp.x, lp.y); lp = null; } }, 550) };
  }, { passive: true });
  cw.addEventListener('touchmove', (e) => { if (lp && (e.touches.length > 1 || Math.hypot(e.touches[0].clientX - lp.x, e.touches[0].clientY - lp.y) > 10)) { clearTimeout(lp.t); lp = null; } }, { passive: true });
  cw.addEventListener('touchend', () => { if (lp) { clearTimeout(lp.t); lp = null; } });
  cw.addEventListener('wheel', (e) => { if (!e.ctrlKey && !e.metaKey) return; e.preventDefault(); setZoom(R.ppd * Math.exp(-e.deltaY * 0.0025), e.clientX); }, { passive: false });
  let pinch = null, praf = 0;
  const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  cw.addEventListener('touchstart', (e) => { if (e.touches.length === 2) pinch = { d: dist(e.touches), ppd: R.ppd, cx: (e.touches[0].clientX + e.touches[1].clientX) / 2 }; }, { passive: true });
  cw.addEventListener('touchmove', (e) => { if (!pinch || e.touches.length !== 2) return; e.preventDefault(); const v = pinch.ppd * dist(e.touches) / pinch.d; cancelAnimationFrame(praf); praf = requestAnimationFrame(() => setZoom(v, pinch.cx)); }, { passive: false });
  cw.addEventListener('touchend', (e) => { if (e.touches.length < 2) pinch = null; });
  let rt = 0;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { applyLayout(); renderTimeline(); if (!R.scrolled) scrollToToday(); }, 120); });
  addEventListener('hashchange', () => { if (location.hash === '#lab') { UI.labOpen = true; saveUI(); renderLab(); } });
  setInterval(() => { const t = todayDay(); if (t !== TODAY) { TODAY = t; renderAll(); } }, 60000);
  addEventListener('storage', (e) => { if (e.key === LS_STATE && e.newValue) { try { S = migrate(JSON.parse(e.newValue)); renderAll(); } catch { /* ignore */ } } });
}

/* =====================================================================
   7 DEMO — built around today so it always looks alive
   ===================================================================== */
function demoState(t = TODAY) {
  const Y = parts(t).y, d = (k) => fromDay(t + k), y = (md) => `${Y}-${md}`;
  const past = (iso) => (iso && toDay(iso) <= t ? iso : null);
  const P = { health: uid(), cs: uid(), home: uid() };
  const G = { fun: uid(), money: uid(), learning: uid(), admin: uid() };
  const it = (o) => baseItem(o);
  const items = [];
  const add = (o) => { const x = it(o); items.push(x); return x; };

  // Health: repeating dentist — one item, past visits in history
  const hist = (due, booked, done, note) => ({ id: uid(), due, notBefore: null, bookedFor: booked, completedAt: done, note });
  add({ title: 'Dentist checkup', projectId: P.health, repeatMonths: 6, repeatFrom: 'done', notes: 'Dr. Müller, Hauptstraße 12. Bring insurance card.',
    due: fromDay(addMonths(t - 170, 6)),
    history: [hist(d(-330), d(-352), d(-352), 'Cleaning'), hist(d(-150), d(-170), d(-170), 'All fine')] });
  // blood → flu (flu done out of order)
  const blood = add({ title: 'Blood checkup', projectId: P.health, notBefore: d(-120), due: d(-20), bookedFor: d(-27), completedAt: d(-25), notes: 'Vitamin D a bit low' });
  add({ title: 'Flu shot', projectId: P.health, notBefore: d(-60), due: d(30), completedAt: d(-30), dependsOn: [blood.id], notes: 'Pharmacy, walk-in' });

  // CS50W final project: parent with dated sub-items in a chain
  const cs = add({ title: 'CS50W final project', projectId: P.cs, tagIds: [G.learning], notBefore: d(-10), due: d(34) });
  const s1 = add({ title: 'Pick idea', parentId: cs.id, due: d(3), completedAt: d(-2), notes: 'Timeline planner', order: 0 });
  const s2 = add({ title: 'Data model', parentId: cs.id, due: d(12), dependsOn: [s1.id], order: 1 });
  const s3 = add({ title: 'Timeline UI', parentId: cs.id, due: d(26), dependsOn: [s2.id], order: 2 });
  add({ title: 'README + screencast', parentId: cs.id, dependsOn: [s3.id], order: 3 });

  // Home improvement chain
  const sk1 = add({ title: 'Hang SKÅDIS board #1', projectId: P.home, due: d(12) });
  const sk2 = add({ title: 'Hang SKÅDIS board #2', projectId: P.home, due: d(26), dependsOn: [sk1.id] });
  add({ title: 'Choose new TV', projectId: P.home, notBefore: d(27), due: d(96), dependsOn: [sk2.id] });

  // No project
  add({ title: 'Watch Dune: Part Three', tagIds: [G.fun], notBefore: d(34), due: d(64), bookedFor: d(51) });
  const kb = add({ title: 'Sell keyboards', tagIds: [G.money], notBefore: y('01-01'), due: y('12-31'), notes: 'Shelf is full. Four have to go this year.' });
  [['03-20', 'Keychron Q1 – 120 €'], ['07-08', 'GMMK Pro – 90 €'], ['09-14', 'Tofu60 – 70 €'], [null, '']].forEach(([md, note], k) => {
    const c = md ? past(y(md)) : null;
    add({ title: `Sell keyboard ${k + 1}`, parentId: kb.id, completedAt: c, notes: c ? note : '', order: k });
  });
  add({ title: 'Car inspection (TÜV)', tagIds: [G.admin], due: d(20), bookedFor: d(-6) });
  // yearly, fixed rhythm (counted from the due date)
  add({ title: 'Tax return', tagIds: [G.admin], repeatMonths: 12, repeatFrom: 'due', due: fromDay(addMonths(toDay(y('07-31')), toDay(y('07-31')) < t ? 12 : 0)),
    history: [hist(y('07-31').replace(String(Y), String(Y - 1)), null, y('07-31').replace(String(Y), String(Y - 1)).replace('07-31', '07-12'), 'Filed online')].filter((h) => toDay(h.completedAt) <= t) });
  add({ title: 'Renew passport', tagIds: [G.admin], due: d(-9) });

  return normalize({
    schemaVersion: SCHEMA, settings: { theme: 'system', weekStart: 1, dueSoonDays: 14 },
    projects: [
      { id: P.health, name: 'Health', color: '#d14d72', order: 0, archived: false },
      { id: P.cs, name: 'CS50W', color: '#2f6fed', order: 1, archived: false },
      { id: P.home, name: 'Home improvement', color: '#c4762b', order: 2, archived: false },
    ],
    tags: [
      { id: G.fun, name: 'fun', color: '#8a5cd6' }, { id: G.money, name: 'money', color: '#2e9e5b' },
      { id: G.learning, name: 'learning', color: '#0f8f9c' }, { id: G.admin, name: 'admin', color: '#5f6f82' },
    ],
    items, lastModifiedAt: new Date().toISOString(),
  });
}

/* =====================================================================
   8 BOOT
   ===================================================================== */
function welcome() {
  const sh = openSheet(`<div class="kind">Welcome</div><h2>Timeline Planner · v2 prototype</h2>
    <p>Items have a <b>due</b> date, optionally a <b>not before</b> date (→ a window) and a <b>scheduled</b> date (appointment). Sub-items, suggested order (arrows) and repeat-after-done.</p>
    <p class="muted">Data stays in this browser. Add <code>#lab</code> to the URL to compare style variants.</p>
    <div class="acts"><button class="btn" data-w="import">Import…</button><span class="sp"></span><button class="btn" data-w="empty">Start empty</button><button class="btn primary" data-w="demo" autofocus>Load demo</button></div>`, 'Welcome');
  sh.onclick = (e) => {
    const b = e.target.closest('[data-w]'); if (!b) return;
    if (b.dataset.w === 'demo') { replaceAll(demoState()); closeSheet(); }
    else if (b.dataset.w === 'empty') { replaceAll(emptyState()); closeSheet(); }
    else pickImport();
  };
}

(function boot() {
  const isNew = loadAll();
  if (location.hash === '#lab') UI.labOpen = true;
  bind();
  renderAll();
  requestAnimationFrame(scrollToToday);
  if (isNew) welcome();
  document.documentElement.dataset.ready = '1';
})();
</script>
